 adaptive messaging, the experience treated all users the same — and in doing so, lost too many of them.</p></div></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Objective\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Helping Users Start Strong and Stick Around\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Design an onboarding experience that reduces drop-offs, especially at the payment stage, and aligns more closely with the realities of B2B decision-making. The goal was to increase activation rates by understanding who the user is, what their role is, and how to better guide them through the setup and number purchase journey.\n            </p></div></div>","l":"Objective"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">\n              Product Design | UX Research | Product Design | UX Strategy | Information Architecture | tracking | Interaction Design\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              As the Lead Product Designer on this project, I was responsible for reimagining the onboarding flow to reduce payment-related drop-offs and improve user activation. I worked cross-functionally with product, engineering, and business teams to understand user behavior, uncover friction points, and design a more adaptive and intuitive experience. My work spanned research, flow architecture, interaction design, and implementation support.\n            </p></div></div>","l":"My Role"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">Investigation &amp; Enquiry</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Before jumping into design, I collaborated with the team to audit the existing onboarding flow and understand where and why users were dropping off. We analyzed user behavior data using Metabase, the company’s internal metrics tool, and combined those insights with session replays and internal interviews.</p><p class=\"tw-leading-[1.5] tw-mb-0\">To go even deeper, I partnered with the PM to personally conduct user interviews, hopping on direct calls with users who had dropped off during onboarding. We listened to their frustrations, uncovered intent gaps, and gathered first-hand insight into what was blocking conversion.</p><p class=\"tw-leading-[1.5] tw-mb-0\">We also mapped out typical onboarding paths and identified decision-making bottlenecks. This helped us uncover key questions: Who’s actually signing up? Do they have the authority to pay? At what points do they hesitate or abandon the process?</p><p class=\"tw-leading-[1.5]\">These learnings formed the foundation of our redesign strategy.</p></div></div></div>","l":"Investigation & Enquiry"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              the goals\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Make Onboarding Smarter, Softer, and More Human\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">It wasn’t just about reducing friction—it was about designing trust.</p><p class=\"tw-leading-[1.5] tw-mb-0\">We wanted to create an onboarding flow that felt tailored, helpful, and aligned with real user behavior—especially in a market where payments and business tools come with high stakes and skepticism.</p><ul class=\"tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Reduce onboarding abandonment</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Collect cleaner user segmentation for smarter follow-up</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Drive successful setup of phone numbers and call flows</span></li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Build trust and value before asking for payment</span></li></ul></div></div></div>","l":"the goals"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              The Strategy\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Ground Up, First Principles, Role-Aware\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">We redesigned onboarding like a conversation, not a funnel.</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">We started with a full journey audit and mapped user intent to product value. With insights from business, support, and data, we introduced segmentation, guidance, and subtle nudges at each critical point.</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><ul class=\"tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Mapped users by role (admin, staff, business owner) to tailor flow</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Introduced industry and team size capture early on</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Implemented drop-off detection + modals with redirect options</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Streamlined the number tagging and workspace activation flows</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Used smart, context-aware CTAs to guide users progressively</span></li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Reimagined exit-intent on invoice screens to recover lost interest</span></li></ul></div></div></div>","l":"The Strategy"},{"t":"img","src":"/assets/6cca2ea71bb82c10.webp","w":1894,"h":2446,"alt":"Solution ~  Key Features We Weren’t Just Designing UI, We Were Nudging Behavior This wasn’t about adding polish — it was about shifting momentum. Every screen, button, and micro-interaction was designed to guide users through hesitation, reduce friction, and build trust. We treated onboarding like a conversation, not a checklist — meeting users with the right message, tone, and action at every cri","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-relative tw-shrink-0\"><p class=\"tw-[word-break:break-word] fm4 tw-leading-[1.035] tw-min-w-full tw-not-italic tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Hi-FI Designs\n            </p></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"/assets/2cd5961b2e8ccd23.webp","w":1894,"h":850,"alt":"Role-based segmentation: Onboarding asks change based on who’s signing up","l":"Role-based segmentation: Onboarding asks change based on who’s signing up"},{"t":"img","src":"/assets/aee73f7c1f17e99a.webp","w":1900,"h":922,"alt":"Validation & Results Its sticky and shareable We turned onboarding into a signal, not a black hole. Initial testing and live rollout results have been promising—and they’ve validated our bet on personalization and clarity. -38% reduction in drop-off  during number setup +28% complete onboardings with activated numbers +15% payment completion rise in payment completion rates during onboarding 3x re","l":"Validation & Results"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Onboarding is a Narrative, Not a Checklist\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">We stopped thinking like product people—and started thinking like storytellers.</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">This project reminded us that onboarding is where users decide: “Do I belong here? Does this make sense for me? Do I trust this platform to solve my problem?”</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><ul class=\"tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Role-awareness builds immediate trust and relevance</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Personalised CTAs outperform static ones by a wide margin</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Visual clarity (steps, groupings, whitespace) reduces cognitive fatigue</span></li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Giving users the chance to pause, defer, or reroute often leads to better long-term conversion</span></li></ul></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              in conclusion\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              What looks like \"just a better onboarding\" was actually an alignment of product, people, and purpose.\n              <br>\n              This is the kind of design I believe in, where flows become stories, CTAs become nudges, and users feel seen from the very first click.\n            </p></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Damilola Olayiwola - Product Designer</p><p class=\"tw-leading-[1.5] tw-mb-0\">Zainab - Developer</p><p class=\"tw-leading-[1.5]\">\n                Mayowa - CEO\n                <br>\n                Folashade - Head of Customer Experience\n                <br>\n                Saviour - Product Designer\n                <br>\n                Utomobong - Product Manager\n              </p></div></div></div>","l":"team members"}],"thumb":"/assets/60148b848c7a35ca.webp","cover":"/assets/cef5771389d33f1a.webp","frame":"2600:53855"},{"slug":"lendsqr-cash-split","co":"lendsqr Africa","yr":"2025","site":"https://lendsqr.com","title":"Human-first bill splitting for the Nigerian social economy","sub":"","toc":[["Context and Background",1],["Problem",3],["Objective",4],["My Role",6],["Investigation & Enquiry",7],["User Personas",8],["Design Goals",9],["Design Language & Rationale",10],["Solution ~ ",11],["Hi-FI Designs",12],["Dashboard",13],["Transaction receipt screen",14]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            Context and Background\n          </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">\n              Lendsqr, a leading Nigerian fintech company, is expanding beyond credit infrastructure to create a more holistic financial experience for everyday users. As part of its consumer app evolution, we introduced Split &amp; Settle — a group expense feature designed to reflect the realities of shared living, social culture, and informal finance in Nigeria.\n              <br><br></p><p class=\"tw-leading-[1.5] tw-mb-0\">From suya nights to rent splitting, Nigerians often handle money communally. But the tools they use—spreadsheets, group chats, transfers—are clunky, stressful, and awkward to manage. This feature was built to change that.</p><p class=\"tw-leading-[1.5]\">Split &amp; Settle is Lendsqr’s answer to social payments—rooted in cultural nuance, trust-building UX, and the flexibility to work across offline and online realities.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"/assets/23c8c7d65410e823.webp","w":1902,"h":870,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            Problem\n          </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n            Designing for Shared Realities, Not Just Shared Costs\n          </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n            How might we help Nigerians split expenses in dynamic social groups, without awkward reminders, manual spreadsheets, or clunky confirmations, while preserving trust, transparency, and cultural nuance?\n          </p></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            Objective\n          </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n            Rethinking Shared Payments for the Nigerian Social Economy\n          </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n            In Nigeria, money rarely moves alone—it moves in groups. From shared rent and bulk groceries to Friday suya nights and surprise birthday hangouts, social payments are deeply woven into everyday life. But splitting expenses still feels clunky, awkward, and built for a reality that isn’t ours. This project, built into Lendsqr’s consumer app, reimagines the group payment experience with cultural context, trust, and fluidity at its core.\n          </p></div></div>","l":"Objective"},{"t":"img","src":"/assets/a940c8f221cbcd11.webp","w":1902,"h":884,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            My Role\n          </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">\n            Product Design | UX Research | Product Design | UX Strategy | Information Architecture | Developer Management | Interaction Design\n          </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n            I led the entire initiative end-to-end. From framing the core problem and defining the user flows, to designing the high-fidelity experience and guiding the implementation. My role also included managing the developer and ensuring the final product shipped with the intended UX integrity.\n          </p></div></div>","l":"My Role"},{"t":"img","src":"/assets/878fa4e58bbe8bbb.webp","w":1894,"h":1235,"alt":"Investigation & Enquiry Before diving into design, I spoke with real users, flatmates, friends, event planners, and side-hustling corps members, who regularly share expenses. What surfaced wasn’t just friction around money, but the emotional strain and awkwardness that often came with managing it. These conversations, alongside behavioral mapping and light competitive research, revealed pain point","l":"Investigation & Enquiry"},{"t":"img","src":"/assets/8ecb47276c06eed3.webp","w":1902,"h":848,"alt":"User Personas We interviewed and synthesized insights around three typical user groups:","l":"User Personas"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            Design Goals\n          </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n            Based on user insights and behavioral patterns, I established key design goals that prioritized cultural context, ease of use, and emotional sensitivity. These goals served as guiding principles throughout the process, ensuring that the solution felt not only functional—but familiar, respectful, and intuitive to the people it was built for.\n          </p></div></div>","l":"Design Goals"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">Design Language &amp; Rationale</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-mb-0\"><span class=\"tw-leading-[1.5]\">I intentionally designed for </span><span class=\"tw-[text-decoration-skip-ink:none] tw-[text-underline-position:from-font] tw-[word-break:break-word] tw-decoration-from-font tw-decoration-solid fh7 tw-leading-[1.5] tw-not-italic tw-underline\">recognition</span><span class=\"tw-leading-[1.5]\"> over </span><span class=\"tw-[text-decoration-skip-ink:none] tw-[text-underline-position:from-font] tw-[word-break:break-word] tw-decoration-from-font tw-decoration-solid fh7 tw-leading-[1.5] tw-not-italic tw-underline\">consumption</span><span class=\"tw-leading-[1.5]\">\n                . The app had alot of visual cures to make the app feel familiar, like other fintech tools, but leans more social and approachable. I also applied visual anchoring principles; reducing screen clutter, offering only 1–2 main CTAs per screen, and using color hierarchy to guide user action.\n                <br>\n                It could all be broken down to this:\n              </span></p><p class=\"tw-mb-0\"><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Typography:</span><span class=\"tw-leading-[1.5]\"> Clean, bold, legible. Prioritizes numbers and CTAs.</span></p><p class=\"tw-mb-0\"><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Visual Cues: </span><span class=\"tw-leading-[1.5]\">Familiar icons, Nigerian-style emojis, color codes for paid/pending.</span></p><p><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Aesthetics:</span><span class=\"tw-leading-[1.5]\"> Clear and confident. Feels like a trusted financial tool, with a social twist.</span></p></div></div></div>","l":"Design Language & Rationale"},{"t":"img","src":"/assets/03880fdb947da402.webp","w":1894,"h":2625,"alt":"Solution ~  Key Features We interviewed and synthesized insights around three typical user groups: 🔑 Split for Now, Settle Later Users can log a group expense, assign portions, and allow friends to settle over time—without chasing. 🔑 USSD & Offline Syncing Offline users can log or confirm payment via USSD. The app syncs when back online. 🔑 Group Wallets & Chip-in Events Prepay features for events,","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            Hi-FI Designs\n          </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n            From flows to finesse — here’s how the final screens came to life with clarity, culture, and context in mind.\n          </p></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"/assets/e007d94b0aeb932a.webp","w":1894,"h":846,"alt":"Dashboard A section on the dashboard is dedicated to payment reminders/request that have been made to certain users within the app ecosystem. with a CTA - ‘Pay Up’ that allows the user carry out their preferred tasks and clear out their payment backlogs","l":"Dashboard"},{"t":"img","src":"/assets/7ec429a44a0b7eb3.webp","w":1894,"h":846,"alt":"Transaction receipt screen The primary CTA on the transaction receipt for al direct transfers made on the app, is the Split Bill feature, that allows users create a split list of their friends or groups and sends a broadcast payment link to them all respectively","l":"Transaction receipt screen"},{"t":"img","src":"/assets/4695529e4a33cfc6.webp","w":1894,"h":846,"alt":"Payment page for customers(web) without the app For users that don’t have the app, whenever they click on the link that has been shared to them, it would take them to a web payment page with multiple options of payment to choose from, but with the ‘Bank Transfer’ option preselected as its statistically the most used payment option in the market at the moment","l":"Payment page for customers(web) without the app"},{"t":"img","src":"/assets/e142f858f43535d4.webp","w":1894,"h":846,"alt":"Split bill page On the ‘split bill’ screen, users would get an option to split the bill equally amongst all the users they have added to the list, but in scenarios where the users doesn’t want to spill the bill equally, they can manually input each user’s amount. This button makes it much easier to input amounts for equal debt scenarios When the users are adding participants, they get the option t","l":"Split bill page"},{"t":"img","src":"/assets/2fd74899defcd161.webp","w":1894,"h":846,"alt":"Bill tracking Page The user can track friends and families that have paid or not and can also send them reminders/notifications on their delayed payments using this easy button here","l":"Bill tracking Page"},{"t":"img","src":"/assets/2420c85c693f9382.webp","w":1896,"h":592,"alt":"Validation & Results Its sticky and shareable Since integrating Split & Settle into Lendsqr’s consumer app, the feature has proven to be more than just useful — it’s sticky, shareable, and genuinely changing how Nigerians handle group money. +20% returning users within 3 months of release –15% drop-off rate at expense confirmation screen +30% re-use rate of existing group splits 1.2x re-use rate d","l":"Validation & Results"},{"t":"img","src":"/assets/7ec429a44a0b7eb3.webp","w":1894,"h":846,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            Strategic Wins\n          </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n            Looking Back, Building Forward\n          </p><ul class=\"tw-block fh4 tw-leading-[0] tw-list-disc tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic tw-text-white\">Lower CAC:</span>\n               Group-based features increased organic user acquisition.\n            </li><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic tw-text-white\">Product stickiness:</span><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\"> </span>Repeat usage signals high trust and emotional alignment.\n            </li><li class=\"tw-leading-[1.5] tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic tw-text-white\">New revenue channels:</span>\n               Future integrations with vendors and event partners now on roadmap.\n            </li></ul></div></div>","l":"Strategic Wins"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            reflection / Learnings\n          </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n            Looking Back, Building Forward\n          </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Building Split &amp; Settle for Lendsqr wasn’t just about solving for shared expenses, it was about designing around trust, cultural nuance, and infrastructural realities.</p><p class=\"tw-leading-[1.5] tw-mb-0\">For me and the team, this project reinforced a few key lessons:</p><ul class=\"tw-list-disc tw-mb-0\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Designing for humans means designing beyond the screen. We had to think about awkward conversations, low-trust environments, and social etiquette — not just buttons and flows.</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Cultural intuition is product strategy. Features like tone-sensitive reminders or group chip-ins weren’t just UX wins, they reflected lived experiences. That empathy helped the feature resonate.</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Constraints shape clarity. Designing for offline users, USSD confirmations, and partial payments challenged us to simplify, prioritize, and get real about who we were building for.</span></li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Collaboration was everything. Engineering, design, and research worked closely, feeding insights into each iteration. Our best ideas came from cross-functional tension — and deep listening.</span></li></ul><p class=\"tw-leading-[1.5]\">This project reminded us that when you combine strategic thinking, local context, and thoughtful design, even something as “simple” as splitting a bill can feel like a human win.</p></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            in conclusion\n          </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"fh7 tw-leading-[1.5]\">Split &amp; Settle</span><span class=\"tw-leading-[1.5]\"> isn’t just a feature, it’s a cultural bridge. It’s a way of acknowledging that Nigerian life is often lived together, and that money, handled with empathy, can feel less like friction and more like flow.</span></p></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            team members\n          </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Damilola Olayiwola - Product Designer</p><p class=\"tw-leading-[1.5]\">\n              Andrew Sonori - Mobile Developer\n              <br>\n              Karin Adetona - Product Manager\n            </p></div></div></div>","l":"team members"}],"thumb":"/assets/f557a0849ebd4ee8.webp","cover":"/assets/319033791feb80e5.webp","frame":"2600:48572"},{"slug":"startbutton-bulk-payment","co":"Startbutton Africa","yr":"2022","site":"https://startbutton.africa","title":"Enabling local businesses sell beyond boundaries","sub":"","toc":[["Context and Background",1],["Problem",3],["Objective",4],["My Role",6],["Investigation & Enquiry",7],["User Personas",8],["Design Language & Rationale",10],["Solution ~ Key Features",11],["Hi-FI Designs",12],["Validation & Results",19],["Reflection / Learnings",21],["Team Members",23]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Context and Background\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">Startbutton is a leading comprehensive Merchant of Record (MoR) platform designed to bridge the gap between African businesses and global markets. By acting as a legal and financial intermediary, Startbutton allows merchants to sell in multiple African countries and beyond without the logistical burden of establishing a physical presence or navigating complex foreign regulatory landscapes.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">As a compliance and merchant of record platform, startbutton simplifies cross-border commerce by enabling seamless acceptance of local payments, facilitating accurate remmitance of local taxes and ensuring adherence to all local regulations. The product suite gives merchants the tools needed to succeed in any country they go-live in.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"/assets/48fa3a1655bff1cc.webp","w":1902,"h":870,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Bridging the Compliance and Currency Gap for African Global Trade\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Expanding a business across African borders is notoriously difficult. Merchants typically face four major hurdles: the legal requirement to establish a physical local entity, the complexity of navigating diverse tax (VAT/GST) and compliance regulations in each country, and the fragmented nature of African payment methods. These barriers often lead to high operational costs, lengthy setup times (often exceeding 6 months), and lost revenue from potential customers in neighboring markets and FX-currency fluctuations and management.\n            </p></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Objective\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              One-platform to rule them all: Engineering a Unified Ecosystem for Cross-Border Merchant Operations\n            </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"tw-leading-[1.5]\">The objective was to design a comprehensive Merchant of Record (MoR) platform that abstracts these complexities. The goal was to build a \"</span><span class=\"fh7 tw-leading-[1.5]\">Business-in-a-Box</span><span class=\"tw-leading-[1.5]\">\" solution where Startbutton acts as the legal reseller on behalf of merchants, allowing them to sell, collect payments, and manage finances in multiple African countries instantly without a physical presence whilst also complying with local legal regimes.</span></p></div></div>","l":"Objective"},{"t":"img","src":"/assets/dd71c860e515f838.webp","w":1902,"h":884,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">\n              Product Design | UX Research | Product STRATEGY | UX Strategy | Information Architecture | Developer Management | Interaction Design\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              I led the entire initiative end-to-end. From framing the core functionality for the v.1 and defining the user flows, to designing the high-fidelity experience and guiding the implementation. My role also included managing the developer and ensuring the final product shipped with the intended UX integrity.\n            </p></div></div>","l":"My Role"},{"t":"img","src":"/assets/b497733b42beb905.webp","w":1894,"h":1522,"alt":"Investigation & Enquiry To build a solution that truly solved merchant pain points, we conducted: Stakeholder Interviews : Speaking with cross-border merchants to understand the specific regulatory \"walls\" they hit when expanding; also speaking with the founders to understand their vision for the product and current understanding of regulatory blockers they’ve identified. Competitive Analysis:  Re","l":"Investigation & Enquiry"},{"t":"img","src":"/assets/a7cee925794ece19.webp","w":1894,"h":996,"alt":"User Personas We interviewed and synthesized insights around three typical user groups: Koffi Mensah The Cross-Border Retail Specialist Age : 28 Location : Nairobi, Kenya Bio : Koffi operates a high-end apparel brand, specializing in items like luxury footwear (e.g., Nike Air Max). He sells to customers in the USA, UK, and Nigeria. While his sales are high, his business is frequently targeted by f","l":"User Personas"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Design Goals\n            </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-w-[887px]\"><span class=\"tw-leading-[1.5]\">The primary design goal was to develop a unified, high-trust digital interface that abstracts the inherent complexities of cross-border trade for African merchants. By prioritizing transparency and guided compliance, the platform was designed to transform intimidating legal and financial hurdles—such as local payment collections, taxes and its accompanying hurdles—into intuitive, step-by-step workflows. The focus was on creating a \"</span><span class=\"fh7 tw-leading-[1.5]\">Business-in-a-Box</span><span class=\"tw-leading-[1.5]\">\" experience where users can seamlessly pivot between multi-currency account management (USD, GBP, KSH), contesting fraudulent chargebacks, and generating professional invoices, effectively reducing the logistical barriers to entering global markets.</span></p></div></div>","l":"Design Goals"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">Design Language &amp; Rationale</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-w-[887px]\"><p class=\"tw-mb-0 tw-whitespace-pre-wrap\"><span class=\"tw-leading-[1.5]\">The design language adopted was one of simplicity with ample white space to reduce overall cognitive load on users. To this end, the primary mantra for the design language was </span><span class=\"tw-[text-underline-position:from-font] tw-[word-break:break-word] tw-decoration-from-font tw-decoration-solid fh7 tw-leading-[1.5] tw-not-italic tw-underline\">Transparency, Trust and </span><span class=\"tw-[text-decoration-skip-ink:none] tw-[text-underline-position:from-font] tw-[word-break:break-word] tw-decoration-from-font tw-decoration-solid fh7 tw-leading-[1.5] tw-not-italic tw-underline\">simplicity</span><span class=\"tw-leading-[1.5]\">. As a platform that manages a deluge of financial data, it </span><span class=\"tw-leading-[1.5]\">was</span><span class=\"tw-leading-[1.5]\"> imperative for the platform to be easy on the user’s cognitive capacity in order to reduce the time it takes to complete actions and find information as well as give users the necessary data about their money. We approached this in three ways:</span></p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><ul class=\"tw-leading-[1.5] tw-list-disc tw-mb-0\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Trust and Professionalism:</span>\n                   Since the platform handles significant financial and legal data, I chose a clean, high-contrast interface.\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Information Architecture:</span>\n                   Given the high volume of data (income, expenses, registrations), I utilized a sidebar-driven navigation system to keep core tools like \"Accounts,\" \"Invoicing,\" and \"Bookkeeping\" always accessible.\n                </li><li class=\"tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Progressive Disclosure:</span>\n                   To avoid overwhelming users during complex tasks like \"Company Incorporation,\" I designed multi-step flows that only ask for necessary information at each stage.\n                </li></ul><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">This resulted in the following design choices:</p><p class=\"tw-mb-0 tw-whitespace-pre-wrap\"><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Typography:</span><span class=\"tw-leading-[1.5]\"> Clean, legible. Prioritizes numbers and CTAs.</span></p><p class=\"tw-mb-0 tw-whitespace-pre-wrap\"><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Visual Cues: </span><span class=\"tw-leading-[1.5]\">Familiar icons, clear color codes for statuses, tooltips.</span></p><p class=\"tw-whitespace-pre-wrap\"><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Aesthetics:</span><span class=\"tw-leading-[1.5]\"> Clear, clean and breathable. Feels like a trusted financial tool for powerful business scalers.</span></p></div></div></div>","l":"Design Language & Rationale"},{"t":"img","src":"/assets/28e3888288c05cc2.webp","w":1894,"h":3378,"alt":"Solution ~  Key Features The platform was built around four central pillars derived from the design requirements: 🔑 Unified Financial Hub (Accounts) Connect, fund, and send across currencies. Convert funds between local and global currencies. 🔑 Flexible Invoicing & Payment Management Tiered invoicing options: Quick Invoices for fast payments or Professional Invoices with tax and discounts. 🔑 Autom","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Hi-FI Designs\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              A snapshot of some of the clean solutions I designed\n            </p></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"/assets/c2eacfebc440418e.webp","w":951,"h":520,"alt":"DASHBOARD","l":"DASHBOARD"},{"t":"img","src":"/assets/201937b9ce389b35.webp","w":1902,"h":1040,"alt":"Accounts page","l":"Accounts page"},{"t":"img","src":"/assets/63dde96197703bfe.webp","w":1902,"h":1040,"alt":"ACCOUNTS > CURRENCY PAGE","l":"ACCOUNTS > CURRENCY PAGE"},{"t":"img","src":"/assets/f89354e8ffd90247.webp","w":1902,"h":1040,"alt":"CHARGEBACKS DETAILS PAGE","l":"CHARGEBACKS DETAILS PAGE"},{"t":"img","src":"/assets/6a890d82323ac164.webp","w":1902,"h":1040,"alt":"CREATE INVOICE","l":"CREATE INVOICE"},{"t":"img","src":"/assets/ca8910179420d8a7.webp","w":1896,"h":847,"alt":"","l":""},{"t":"img","src":"/assets/a3968295961c0cf6.webp","w":1896,"h":592,"alt":"Validation & Results Rapid expansion, onboarding and operations Since the launch of Startbutton’s platform, the product has proven to be more than just useful — it’s seamless, scalable, and genuinely changing how merchants within and outside Africa handle cross-border payments and expansion. $10m + processed within the first 6months of launching the dashboard +150 TRANSACTING MERCHANTS onboarded s","l":"Validation & Results"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Strategic Wins\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Looking Back, Building Forward\n            </p><ul class=\"tw-block fh4 tw-leading-[0] tw-list-disc tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-w-[887px]\"><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic tw-text-white\">Lower CAC:</span>\n                 Merchant referrals drive organic user acquisition thereby reducing costs.\n              </li><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px] tw-whitespace-pre-wrap\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic tw-text-white\">Product retention:</span><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\"> </span>Repeat usage signals high trust and business alignment of  being the foremost MOR in Africa.\n              </li><li class=\"tw-leading-[1.5] tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic tw-text-white\">New revenue channels:</span>\n                 Future integrations with payment providers and new features (i.e subscriptions, auto-debit etc).\n              </li></ul></div></div>","l":"Strategic Wins"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Looking Back, Building Forward\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-w-[887px]\"><p class=\"tw-mb-0 tw-whitespace-pre-wrap\"><span class=\"tw-leading-[1.5]\">This project highlighted the significance of designing for \"</span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Regulatory Trust</span><span class=\"tw-leading-[1.5]\">\" and “</span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Local contexts</span><span class=\"tw-leading-[1.5]\">.” In the fintech space, user confidence in the platform is just as crucial as the features offered. I learned to convert complex legal requirements across multiple jurisdictions, such as company incorporation, payments collection and checkout, into user-friendly UI elements that feel empowering instead of overwhelming. </span></p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">If I were to continue improving, I would concentrate on:</p><ol class=\"tw-list-decimal\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Developing more granular and comprehensive tax reporting tailored to specific regions and currencies; </span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Improving localization strategies for merchants; </span></li><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\">\n                  Incorporating user feedback to refine the design process especially for end-customers\n                  ; and \n                </li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Staying updated on regulatory changes to ensure compliance and trust.</span></li></ol></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              in conclusion\n            </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-w-[887px]\"><span class=\"tw-leading-[1.5]\">Startbutton is a major step in breaking trade barriers in Africa. By integrating regulatory requirements into a user-friendly interface, we turned a lengthy bureaucratic process into a smooth digital experience. From sending funds, converting funds, invoicing, automated bookkeeping and USDT settlement solutions amongst others, every feature equips merchants to operate globally while remaining compliant locally. This project shows that user-centric design can connect fragmented markets, empowering African entrepreneurs to </span><span class=\"fh4 fi tw-leading-[1.5]\">scale beyond borders</span><span class=\"tw-leading-[1.5]\">.</span></p></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Damilola Olayiwola - Lead Product Designer</p><p class=\"tw-leading-[1.5] tw-mb-0\">Yusuf Ajide - Product Designer</p><p class=\"tw-leading-[1.5] tw-mb-0\">Kelvin Esekhile - Frontend Developer</p><p class=\"tw-leading-[1.5] tw-mb-0\">Mallick Bolakale - CEO</p><p class=\"tw-leading-[1.5]\">Kelechi Oti - CTO</p></div></div></div>","l":"team members"}],"thumb":"/assets/6098b62e60af29d3.webp","cover":"/assets/56333f40fc12bc39.webp","frame":"2600:58457"},{"slug":"baige-waas","co":"Baige tech","yr":"2023","site":"","title":"Empowering African Fintechs with Wallet Infrastructure at scale.","sub":"","toc":[["Context and Background",1],["Problem",3],["Objective",4],["My Role",6],["Investigation & Enquiry",7],["User Personas",8],["Design Language & Rationale",10],["Solution ~ Key Features",11],["Hi-FI Designs",12],["Validation & Results",null],["Reflection / Learnings",19],["Team Members",21]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Context and Background\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-mb-0\"><span class=\"tw-leading-[1.5]\">Financial technology in Sub-Saharan Africa has revolutionized how economic value is managed. We've moved from simple P2P transfers to embedded finance and infrastructure-led growth. Nigeria has become a hub for payment innovation, building systems where none existed. By 2025, the focus shifted from \"</span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">banking the unbanked</span><span class=\"tw-leading-[1.5]\">\" to \"</span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">empowering builders</span><span class=\"tw-leading-[1.5]\">,\" emphasizing the need for robust B2B infrastructure. The fragmented payment landscape demands aggregation. Nigeria's Central Bank's push for cashless policies and FX liquidity issues require businesses to adopt multi-currency solutions, managing complex payouts and compliance efficiently.</span></p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Baige emerged as a specialized Wallet as a Service (WaaS) platform designed to bridge the gap in digital financial infrastructure for businesses operating in Nigeria and beyond. The platform operates on a three-pronged architecture involving Admins (Baige), Merchants (Organizations), and End-customers (the final wallet owners). At its core, Baige allows businesses to collect payments in NGN and USD while providing the tools to create and manage multiple sub-wallets for their own customers via a robust API or a centralized dashboard. By offering a white-labeled infrastructure, Baige enables merchants to scale without the heavy lifting of building a proprietary ledger system from scratch.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"/assets/a97266247cd74fc2.webp","w":1894,"h":798,"alt":"Launch Wallets Without Building Infrastructure.","l":"Launch Wallets Without Building Infrastructure."},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Bridging the Compliance and Currency Gap for African Global Trade\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Setting up walleting systems are hard, legally taxing and infrastructurally demanding. Many African merchants face significant hurdles when attempting to scale cross-border operations, particularly regarding multi-currency management (NGN/USD) and stringent KYC (Know Your Customer) compliance. Existing solutions often lack \"granular\" control over individual end-customer wallets, leading to:</p><ul class=\"tw-leading-[1.5] tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Operational Friction</span>: Merchants struggled to manage hundreds of sub-wallets, resulting in a significant increase in manual reconciliation errors.\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Compliance Bottlenecks</span>: Collecting, storing, and upgrading KYC documents of customers across multiple tiers was a fragmented process.\n                </li><li class=\"tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Lack of Visibility</span>\n                  : There was no \"eagle-eye\" view for platform admins to monitor the health of transactions and API requests in real-time.\n                </li></ul></div></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Objective\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Simplifying a Financial Infrastructure for Rapid Scaling\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-mb-0 tw-whitespace-pre-wrap\"><span class=\"tw-leading-[1.5]\">The primary goal was to design a </span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">dual-sided ecosystem; </span><span class=\"tw-leading-[1.5]\">A Merchant Dashboard and an Admin Panel that simplifies the complexities of wallet creation and transaction monitoring. </span></p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">The key objectives included:</p><ul class=\"tw-leading-[1.5] tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Scalability</span>: Enable merchants to create multiple wallets seamlessly via API or Dashboard.\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Control</span>: Provide granular management tools for wallets, including the ability to disable, deactivate, or view detailed inbound/outgoing transaction logs.\n                </li><li class=\"tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Integration</span>: Facilitate one-click connections to major payment gateways like Paystack, Flutterwave, and Stripe.\n                </li></ul></div></div></div>","l":"Objective"},{"t":"img","src":"/assets/91d1b1a313b0ea67.webp","w":1894,"h":586,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">\n              Product Design | UX Research | Product Design | UX Strategy | Information Architecture | Developer Management | Interaction Design\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">As the Lead Product Designer, I was responsible for the end-to-end user experience of the Baige platform across both the merchant-facing side and the admin-facing experiences. My work spanned:</p><ul class=\"tw-leading-[1.5] tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">UX Research &amp; Information Architecture</span>: Mapping out the complex relationships between Organizations and their End-customers.\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Interface Design</span>: Designing high-fidelity web and mobile-web interfaces for both the customer-facing and admin sides.\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Prototyping</span>: Developing interactive flows for wallet creation, KYC uploads, and API monitoring.\n                </li><li class=\"tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Systems Design</span>: Establishing a design language that conveys the brand identity, trust, financial security, and data clarity.\n                </li></ul></div></div></div>","l":"My Role"},{"t":"img","src":"/assets/924a7ddc4aebbf2b.webp","w":1894,"h":1618,"alt":"Investigation & Enquiry Uncovering the Merchant’s and Admin’s needs To understand the needs of our users, I conducted a deep dive into the  API-first versus Dashboard-first  preferences of modern fintechs, especially when it comes to wallet creation and management. Discovery : I found that while developers value the API logs and webhook monitoring features, the operations teams of merchants requir","l":"Investigation & Enquiry"},{"t":"img","src":"/assets/f86c09fe99f6febe.webp","w":1894,"h":1000,"alt":"User Personas We interviewed and synthesized insights around three typical user groups: Aisha Kys Fintech Operations Manager Age :  31 Location :  Abuja, Nigeria Bio:  Aisha is an Operations Manager at a fintech startup providing virtual accounts and digital wallets. She manages wallet operations, transaction monitoring, customer onboarding, and compliance, but faces challenges with fragmented too","l":"User Personas"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Design Goals\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              The primary design goal was to create a clarity-first, compliance-ready wallet infrastructure that could scale with both merchants and their end-customers. The experience needed to surface complex financial data in a way that felt intuitive, actionable, and trustworthy, while reducing operational friction for non-technical teams. Every design decision prioritized visibility, control, and auditability, ensuring users could manage multi-currency wallets, monitor transactions, and meet regulatory requirements confidently from a single platform.\n            </p></div></div>","l":"Design Goals"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">Design Language &amp; Rationale</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-mb-0\"><span class=\"tw-leading-[1.5]\">The design language was built on the principles of </span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">clarity</span><span class=\"tw-leading-[1.5]\">, </span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">density</span><span class=\"tw-leading-[1.5]\">, and </span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">modularity</span><span class=\"tw-leading-[1.5]\">. The design emphasizes a neutral, enterprise‑grade visual language optimized for data density and long operational use. Clarity and consistency drive the experience, with color used for signaling critical states.</span></p><ul class=\"tw-leading-[1.5] tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Typography &amp; Color</span>: Neutral palette; high‑contrast accents for status indicators\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Tables</span>: Paginated with filters and search for large datasets\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Navigation</span>\n                  : 7 items for customers, 5 for admins; supports deep features like Teams &amp; Permissions\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Principles</span>: Clarity over aesthetics, consistency across roles, status‑driven UI, progressive disclosure\n                </li><li class=\"tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Color Usage</span>: Wallet states, transaction outcomes, risk/failure points, and also brand identity.\n                </li></ul></div></div></div>","l":"Design Language & Rationale"},{"t":"img","src":"/assets/27db044be5cc11a7.webp","w":1480,"h":3407,"alt":"Solution ~  Key Features We interviewed and synthesized insights around three typical user groups: 🔑 Merchant Dashboard Overview of NGN and USD balances, historical transaction graphs with date filters, and a quick snapshot of operational health. 🔑 Wallet Management Users can manage individual wallets, view owner KYC files, and track every inbound or outgoing transaction 🔑 Transactions monitoring ","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Hi-FI Designs\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              The platform was designed primarily for Web, but I also developed a Mobile-Web version to ensure that merchants could monitor their dashboard and approve requests on the go.\n            </p></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"/assets/a6c25531b4c801ee.webp","w":1480,"h":664,"alt":"Merchant dashboard","l":"Merchant dashboard"},{"t":"img","src":"/assets/73578319ac960a37.webp","w":1894,"h":850,"alt":"Wallets","l":"Wallets"},{"t":"img","src":"/assets/c2c1f1580704cba5.webp","w":1894,"h":850,"alt":"Customer details","l":"Customer details"},{"t":"img","src":"/assets/4af9cc62ce9f161b.webp","w":1894,"h":850,"alt":"APIs","l":"APIs"},{"t":"img","src":"/assets/8cb7ca899b67a3cf.webp","w":1894,"h":850,"alt":"ADMIN dashboard","l":"ADMIN dashboard"},{"t":"img","src":"/assets/13ccc951a10dc916.webp","w":1894,"h":850,"alt":"ADMIN-MERCHANT’S DETAILS","l":"ADMIN-MERCHANT’S DETAILS"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Looking Back, Building Forward\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">Designing the Baige platform taught me that in Fintech B2B platforms, information density is a feature, not a bug, as long as it is properly organized. The project also taught myself and the team a few key lessons:</p><ul class=\"tw-list-disc tw-mb-0\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Fintech products succeed on clarity, not creativity</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Admin tools deserve as much design attention as user apps</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Tables, filters, and exports are powerful when designed well</span></li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Compliance isn't just a legal requirement; it's a core part of the user journey that needs to be as seamless as the payment itself</span></li></ul><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><p class=\"tw-whitespace-pre-wrap\"><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Future Thinking:</span><span class=\"tw-leading-[1.5]\"> For future iterations, I would look into implementing automated \"Charge\" adjustments based on transaction volume to further empower the Admin side.</span></p></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              in conclusion\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              You can think of Baige as a digital bank-in-a-box. Just as a landlord provides an apartment building (the infrastructure) but allows each tenant to decorate and manage their own room (the wallets), Baige provides the secure structure for merchants to host and manage thousands of individual accounts for their own customers without having to build the building/infrastructure themselves.\n            </p></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Damilola Olayiwola - Lead Product Designer</p><p class=\"tw-leading-[1.5] tw-mb-0\">Yusuf Ajide - Product Designer</p><p class=\"tw-leading-[1.5] tw-mb-0\">Olufunsho Osunaike - CTO</p><p class=\"tw-leading-[1.5]\">Babatunde Dire-Odukale- Product manager</p></div></div></div>","l":"team members"}],"thumb":"/assets/117c42f320544ae8.webp","cover":"/assets/6bffe5f9e6e66d87.webp","frame":"2104:6680"},{"slug":"strategy-360-smart-business","co":"Strategy 360","yr":"2023","site":"","title":"AI Innovation for global businesses.","sub":"","toc":[["Context and Background",1],["Problem",3],["Objective",4],["My Role",6],["Investigation & Enquiry",7],["User Personas",8],["Design Language & Rationale",9],["Solution ~ Key Features",10],["Hi-FI Designs",11],["Validation & Results",17],["Reflection / Learnings",18],["Team Members",20]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Context and Background\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Modern enterprises often grapple with disjointed data silos when attempting to craft long-term business strategies. For many organizations, the transition from raw financial data—like P&amp;L statements and balance sheets—to actionable market insights is a manual, labor-intensive process that can take weeks of consulting hours. This fragmentation leads to a \"strategy-execution gap,\" where a reported 65% of businesses fail to meet their annual targets due to outdated or misaligned financial models.</p><p class=\"tw-leading-[1.5]\">...</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"/assets/d041ed7a70d90d64.webp","w":1894,"h":798,"alt":"AI innovation for your business","l":"AI innovation for your business"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Overcoming the Fragmentation of Strategic Planning and Financial Forecasting\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">Modern enterprises often grapple with disjointed data silos when attempting to craft long-term business strategies. For many organizations, the transition from raw financial data—like P&amp;L statements and balance sheets—to actionable market insights is a manual, labor-intensive process that can take weeks of consulting hours. This fragmentation leads to a \"strategy-execution gap,\" where a reported 65% of businesses fail to meet their annual targets due to outdated or misaligned financial models.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Furthermore, the lack of real-time competitive intelligence means that most strategies are reactive rather than proactive. Without a centralized system to
