 parse complex legal documents and market trends, leadership teams are often forced to make high-stakes decisions based on incomplete information. This inefficiency results in an average 20% loss in potential revenue due to missed market opportunities and unmitigated operational risks.</p></div></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Objective\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Democratizing High-Level Business Intelligence through AI Automation\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">The primary goal of Strategy360 was to develop a \"360-degree\" strategic ecosystem that could ingest raw corporate documents and instantly output sophisticated financial models and operational roadmaps. We aimed to reduce the time spent on manual data entry by 85%, allowing executives to shift their focus from data gathering to strategic decision-making. By leveraging AI to parse everything from partnership agreements to five-year cash flow projections, the objective was to provide a \"single source of truth\" for business health.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Success was defined by creating a platform capable of generating a comprehensive \"Market Attractiveness\" score and a \"Pioneer-Enhance-Mimic\" (PEM) model within minutes of data ingestion. We set a target to improve project completion rates by 30% through integrated performance trackers and automated initiative heatmaps. Ultimately, the objective was to empower businesses to scale rapidly while maintaining a clear view of their burn rate and long-term solvency.</p></div></div></div>","l":"Objective"},{"t":"img","src":"/assets/1bde832dedad25ce.webp","w":1894,"h":586,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">Lead Product Designer &amp; UX Strategist</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">I served as the Lead Product Designer, responsible for the end-to-end user experience of the Strategy360 platform. My responsibilities spanned from initial Information Architecture (IA) and user flow mapping to the creation of a high-fidelity design system that could handle complex data visualization. I collaborated closely with the engineering team to ensure the AI's \"parsing\" states were transparent to the user, reducing the anxiety associated with automated data processing.</p><p class=\"tw-leading-[1.5]\">Beyond visual design, I acted as a UX Strategist, defining how the platform would translate dense financial ratios into digestible dashboards. I led the design of the \"Operational Modelling\" suite, ensuring that the transition from strategic planning to implementation roadmaps was seamless and intuitive. This involved managing the handoff of over 150 unique screens and documenting component behaviors for a scalable build.</p></div></div></div>","l":"My Role"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">Investigation &amp; Enquiry</p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Decoding the Complexity of Strategic Friction\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">To understand the pain points of our target demographic, we conducted a deep dive into how C-suite executives and financial analysts interact with legacy strategy tools. Our research revealed that 74% of users felt \"overwhelmed\" by traditional financial modeling software, often resorting to manual Excel sheets that lacked collaborative depth. We analyzed over 200 support logs from similar SaaS platforms, finding that \"navigational confusion\" accounted for 55% of user drop-offs during the onboarding phase.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">We also performed a competitive audit of platforms to identify gaps in \"User Confidence\". The investigation showed that while many tools provided data, very few provided \"insight.\" This discovery led us to prioritize features like the \"Risk Heat Map\" and \"Buyer Experience Cycle,\" which transform raw numbers into visual narratives. By decoding these frictions, we were able to map a journey that takes a user from \"Document Upload\" to \"AI Strategy\" in under six steps.</p></div></div></div>","l":"Investigation & Enquiry"},{"t":"img","src":"/assets/d99141eef4f555e5.webp","w":1894,"h":1108,"alt":"User Personas Tailoring Strategy for the Visionary and the Operator We interviewed and synthesized insights around three typical user groups: Abdullah The Strategic Visionary Age:  35 Location:  Saudi Arabia About:  Abdullah is focused on high-level market positioning and long-term valuation. They need a bird's-eye view of \"Market Attractiveness\" and \"Competitive Advantages\" to secure funding and ","l":"User Personas"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">Design Language &amp; Rationale</p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Clarity through Structured Minimalism\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">The design language for Strategy360 was built on the principle of \"Confidence through Clarity.\" Given the high cognitive load of financial data, we utilized a clean, structured layout with ample white space to prevent user fatigue. A professional color palette was selected to instill trust, while vibrant accents were reserved for \"AI Generating\" states and \"Success\" indicators to keep users engaged during processing times.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">We adopted a multi-layered \"Dashboard-Centric\" architecture, drawing on Jakob’s Law to ensure the interface felt familiar to users of enterprise tools. The rationale behind the \"Node-Based\" navigation was to allow users to jump between strategic modules—like \"Macro Trends\" and \"Financing\"—without losing their place in the overall flow. This modular approach ensures that the platform feels like a cohesive \"360-degree\" guide rather than a collection of separate tools.</p></div></div></div>","l":"Design Language & Rationale"},{"t":"img","src":"/assets/5b887bf293341c17.webp","w":1303,"h":3369,"alt":"Solution ~  Key Features The 360° Strategic Dashboard for end-to-end planning The core of Strategy360 is the AI-Powered Document Parser, which automates the extraction of mission statements, financial data, and director details from uploaded PDFs. This is complemented by the Dynamic Financial Modeler, which allows users to switch between bottom-up and top-down planning while visualizing 5-year rev","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Hi-FI Designs\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">The high-fidelity designs focus on creating a \"Command Center\" feel for the user. We developed a robust set of data visualization components, including revenue project forecast charts and interactive risk heat maps. Each screen was designed to be responsive, ensuring that executives can review their \"Macro Market\" trends on a tablet as easily as on a desktop.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Key attention was paid to the \"AI Feedback\" loop, where users can \"Approve\" or \"Regenerate\" suggestions for market segmentation and buyer experience cycles. This interactive element ensures the user remains the ultimate decision-maker while the AI does the heavy lifting. The final design system included over 40 reusable components, ensuring consistency across the \"Financial\" and \"Operational\" modules</p></div></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"/assets/80ba3b375081eb8a.webp","w":1243,"h":558,"alt":"","l":""},{"t":"img","src":"/assets/4bf037f9407967b5.webp","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"/assets/01fb932505edd98c.webp","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"/assets/6262adde75a82fb2.webp","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"/assets/149af197ef86a494.webp","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"/assets/740a6dbf7b6e0069.webp","w":1896,"h":930,"alt":"Validation & Results Measurable Impacts on Strategic Efficiency Post-launch metrics indicated a significant shift in how users approach strategic planning. We observed a 45% increase in user engagement with the financial modeling module, with the average time to generate a comprehensive 5-year plan dropping from two weeks to just 48 minutes. Furthermore, 70% of early adopters reported that the \"In","l":"Validation & Results"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Designing for the Gap between Data and Insight\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">This project reinforced that in the world of AI-driven SaaS, \"Confidence is as important as Functionality.\" We learned that simply providing data isn't enough; the design must guide the user through the meaning of that data. By organizing content into logical stages like \"Who You Are,\" \"Your Environment,\" and \"How to Operate,\" we made a daunting process feel manageable and structured.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Another key takeaway was the importance of the \"Human-in-the-Loop.\" While our AI could generate complex market trends and risk assessments, users needed the ability to \"Edit\" and \"Confirm\" these findings to truly own the strategy. Moving forward, I would focus even more on the \"Glossary\" and educational nodes to further bridge the language gap for first-time business owners.</p></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              in conclusion\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              You can think of Baige as a digital bank-in-a-box. Just as a landlord provides an apartment building (the infrastructure) but allows each tenant to decorate and manage their own room (the wallets), Baige provides the secure structure for merchants to host and manage thousands of individual accounts for their own customers without having to build the building/infrastructure themselves.\n            </p></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Damilola Olayiwola - Lead Product Designer/UX Strategist\n            </p></div></div>","l":"team members"}],"thumb":"/assets/b5fb2b80f7a0217b.webp","cover":"/assets/aa40218cbb9ed468.webp","frame":"2600:49245"},{"slug":"intelai-platform","co":"Intel AI","yr":"2024","site":"","title":"State of the art AI training platform for maximum engagement","sub":"","toc":[["Context and Background",1],["Problem",3],["Objective",4],["My Role",6],["Investigation & Enquiry",7],["User Personas",8],["Design Language & Rationale",9],["Solution ~ Key Features",10],["Hi-FI Designs",11],["Validation & Results",17],["Reflection / Learnings",18],["Team Members",20]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Context and Background\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">IntelAI was conceived as a comprehensive AI Community Workspace to address the escalating challenges of information fragmentation and engagement fatigue in modern digital communities. As decentralized projects and influencer networks scale, they often encounter a \"Context Vacuum,\" where critical project data resides in static PDFs or GitBooks while community interactions happen in real-time on platforms like Telegram, Discord, and X. This disconnect leads to community managers spending over 60% of their time answering repetitive queries, leaving them unable to focus on high-level growth or crisis management. Our goal was to create a \"Community Brain\" that could ingest project-specific data and provide instant, accurate, and on-brand responses across all integrated channels. </p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">The initiative targeted two distinct but interconnected user segments: Community Managers handling large-scale memberships and Influencers (Key Opinion Leaders - KOLs) needing to scale content production. For managers, the platform provides a centralized hub to train AI agents on project whitepapers and roadmaps, automate spam filtering, and manage escalation reports for complex queries. For influencers, the focus was on a multi-format content support system that uses the same project-specific intelligence to generate tweets and content calendars that remain 100% faithful to the project's \"Truth\". By providing both a high-fidelity desktop dashboard for deep management and a streamlined mobile interface for engagement on the go, IntelAI ensures that community intelligence is never more than a click away.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"/assets/65ffbd294cf40c5d.webp","w":1894,"h":798,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-min-w-full tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[min-content]\">\n              The Engagement Fatigue and Context Vacuum in Rapidly Scaling Communities\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">As digital ecosystems; particularly within the Web3 and Influencer sectors; experience explosive growth, community managers and KOLs (Key-Opinion-Leaders) face a dual-pronged crisis: engagement fatigue and contextual irrelevance. High-growth communities on platforms like Telegram and Discord generate thousands of messages daily, yet 74% of these interactions are repetitive queries regarding project fundamentals, tokenomics, or basic troubleshooting. Human moderators are often overwhelmed, leading to slow response times and missed opportunities for high-value engagement, while standard AI tools often provide generic, \"hallucinated\" answers that lack the specific nuance of the project’s whitepaper or roadmap.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">The friction lies in the \"Context Vacuum.\" When projects scale, the gap between the available information (whitepapers, pitch decks, FAQs etc etc) and the community's immediate needs widens. My research indicated that community managers were spending upwards of 40 hours a week manually filtering spam and answering the same 15-20 questions. Without a system that could \"learn\" the project’s specific DNA and respond in real-time across multiple channels, projects were seeing an average of 30% drop in community sentiment during critical launch phases due to information bottlenecks.</p></div></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Objective\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Engineering a Context-Aware Neural Infrastructure for Global Communities\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">The objective was to design a comprehensive AI-driven workspace that bridges the gap between static project data and active community engagement. We set out to build IntelAI, a platform that allows community owners to \"train\" their own custom AI agents by simply uploading project-specific assets such as PDFs, Docs, Screenshots, GitBooks, Pitch Decks etc. The goal was to move beyond a simple chatbot and create a \"Community Brain\" capable of not only answering questions but also generating on-brand content, blocking harmful spam, and escalating complex issues to human moderators when necessary.</p><p class=\"tw-leading-[1.5]\">Functionally, the platform needed to be hyper-integrative and scalable. We aimed to reduce the time-to-resolution for community inquiries by about 80% while increasing content output for KOLs and influencers by around 3x. By providing a simulation workspace where users could test prompts before deploying them to live environments like Telegram or X (Twitter), we sought to give project owners 100% confidence in their automated voice, ensuring that every AI-generated response was rooted in the \"Ground Truth\" (largely) of their uploaded documentation.</p></div></div></div>","l":"Objective"},{"t":"img","src":"/assets/6855d316bf3e8afa.webp","w":1894,"h":586,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">Lead Product Designer &amp; UX Strategist</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">I led the end-to-end design lifecycle for both the Desktop and Mobile versions of IntelAI, serving as the bridge between technical AI capabilities and user-centric design. My responsibilities spanned from initial UX research and information architecture to high-fidelity UI design and interaction prototyping. I focused heavily on the \"Training Flow,\" ensuring that the complex backend process of parsing large documents was translated into a simple, intuitive progress-driven interface for the user.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Beyond the visuals, I also acted as the UX Strategist, defining the \"Simulation\" and \"Escalation\" frameworks. I worked closely with the engineering team to ensure the \"Parsing\" states were communicated effectively to users, reducing the anxiety of waiting for AI training to complete. By managing the developer handoff and implementation phase, I ensured that the multi-platform experience remained consistent, whether a community manager was reviewing an escalation report on their desktop or a KOL was generating a tweet on the go.</p></div></div></div>","l":"My Role"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">Investigation &amp; Enquiry</p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Figuring out the Friction in Automated Moderation\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">To build a truly effective tool, we conducted a deep-dive audit of existing community management workflows. We analyzed a plethora of support logs across major Web3 projects and discovered that around 62% of \"critical\" community issues were actually easily resolvable navigation or glossary gaps. However, the existing tools were fragmented; cus moderators were jumping between Telegram bots for spam and Notion for project info, creating a massive cognitive load and an average response delay of 14 minutes per query.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">We equally discovered a significant \"Trust Gap\" regarding AI. Users were hesitant to use automated tools because they couldn't see \"under the hood.\" This led to the design of our Simulation Workspace, where we mapped user interactions to see how they tweaked prompts. We found that users felt 90% more confident in automation when they could \"dry-run\" the AI against their own documentation. These insights shifted our focus from a \"Set and Forget\" bot to a \"Train, Test, and Deploy\" ecosystem.</p></div></div></div>","l":"Investigation & Enquiry"},{"t":"img","src":"/assets/c13e91405f0e44d0.webp","w":1894,"h":1108,"alt":"User Personas A community Manager and A web3 Influencer We synthesized our insights around two primary typical user groups: Marcel Punjab Lead Community Manager Age:  25 Location:  United Kingdom (UK) About:  Marcel is the Lead Community Manager\" for a mid-stage DeFi protocol. Marcus handles a community of 50,000+ members across four time zones. His biggest pain point is information fragmentation;","l":"User Personas"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">Design Language &amp; Rationale</p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Dark Mode Sophistication for the Web3 Digital Frontier\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">The visual identity of IntelAI was crafted to feel authoritative, futuristic, and efficient. We opted for a deep \"Foundry Dark\" palette, which reduces eye strain for users/community managers who spend 8+ hours a day no-lifing on dashboards. The UI uses high-contrast neon accents (mint green and electric blue) to draw attention to critical \"Quick Actions\" and \"Outstanding Tasks,\" ensuring that even in a data-dense environment, the user’s next step is always clear.</p><p class=\"tw-leading-[1.5]\">Also, our information architecture method was a \"Context First\" approach. Thus every screen is anchored by the project's current status; whether the AI is \"Parsing,\" \"Trained,\" or \"Engaging\". We utilized a modular \"Card-Based\" layout for the integration section, allowing users to clearly see the health of their various channels (Telegram, X, Discord) at a glance. This creates a sense of \"Mission Control,\" giving users a psychological feeling of mastery over their complex digital ecosystems.</p></div></div></div>","l":"Design Language & Rationale"},{"t":"img","src":"/assets/a3dbb9f236f3578a.webp","w":1894,"h":3130,"alt":"Solution ~  Key Features Three-Pillar Approach to Intelligent Engagement The core of Strategy360 is the AI-Powered Document Parser, which automates the extraction of mission statements, financial data, and director details from uploaded PDFs. This is complemented by the Dynamic Financial Modeler, which allows users to switch between bottom-up and top-down planning while visualizing 5-year revenue ","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Hi-FI Designs\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">The high-fidelity designs focus on cross-platform parity. On Desktop, the workspace provides an expansive view of analytics, escalation reports, and simulation logs, allowing for deep-dive management. On Mobile, the experience is distilled into \"Management on the Move.\" The training flow uses a simplified, step-by-step wizard, and the tweet generator features a \"Tap-to-Edit\" interface optimized for thumb-driven interactions. Key design elements include the \"AI Parsing State\" animations, which provide visual feedback during the heavy processing of documents, and the \"Success Modals\" that confirm successful integrations with platforms like Telegram via QR codes. Every high-fidelity screen was tested for usability, ensuring that critical alerts (like a high spam rate) are instantly recognizable through both color and iconography.</p></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"/assets/989ff993bbfc468e.webp","w":1184,"h":531,"alt":"","l":""},{"t":"img","src":"/assets/1e336cb7dfbdbab9.webp","w":1776,"h":797,"alt":"","l":""},{"t":"img","src":"/assets/56a958c2e1d3d7c7.webp","w":1184,"h":531,"alt":"","l":""},{"t":"img","src":"/assets/2148a71e9a72c627.webp","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"/assets/5053f35167bb0b29.webp","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"/assets/ab5d08bc49cb20aa.webp","w":1894,"h":690,"alt":"Validation & Results Measured Impact metrics Within the first 12 weeks of deployment across our beta partner projects, we observed a transformative shift in community metrics. By automating 85% of repetitive project inquiries, we saw an immediate 41% reduction in monthly support tickets. Most importantly, the average \"Time to Resolution\" for community queries dropped from 14 minutes to under 45 se","l":"Validation & Results"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Designing for the Gap between Data and Insight\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Looking back, this project reinforced a critical UX lesson that’s now at the fore of current design discussions, that: AI is a collaborator, not a replacement. Initially, we thought users wanted a \"black box\" that handled everything. However, we learned that the most valuable part of IntelAI wasn't just the automation—it was the control we gave back to the users through the training and simulation features. When users could see what the AI \"knew,\" they trusted the system to represent their brand.</p><p class=\"tw-leading-[1.5]\">If I were to start over, I would focus even earlier on the \"Retraining Loop.\" Projects evolve fast, and we found that users needed a more seamless way to \"Update Context\" as their roadmaps changed. Designing a system that feels alive and evolving alongside the project is the next frontier for community management tools. We didn't just design a dashboard; we designed a way for projects to maintain a consistent, intelligent presence in a 24/7 global market.</p></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              in conclusion\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">The deployment of IntelAI across our beta partner projects yielded transformative results, proving that trainable AI is a fundamental requirement for modern community management. Within the first 8 weeks of launch, we observed that 52% of community members were able to resolve their inquiries through the AI's self-service capabilities without ever needing to contact a human moderator. This shift led to a 41% reduction in monthly support tickets, significantly freeing up internal teams to handle high-priority technical issues. Additionally, the average resolution turnaround time for common community queries dropped by 35%, moving from minutes to under 45 seconds.</p><p class=\"tw-leading-[1.5]\">Beyond operational efficiency, the platform successfully bridged the \"Confidence Gap\" for both project owners and community members. Influencers utilizing the AI tweet generator saw a 73% increase in engagement due to their ability to post higher-quality, contextually accurate content more frequently. The Spam Prevention Tool also proved critical, effectively neutralizing malicious bot activity and harmful links with a 99.8% success rate, thereby fostering a safer community environment. Ultimately, the project demonstrated that when AI is designed as a transparent collaborator—allowing users to simulate and update context in real-time; it moves beyond simple automation to become a true engine for scalable human engagement.</p></div></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Damilola Olayiwola - Lead Product Designer/UX Strategist\n            </p></div></div>","l":"team members"}],"thumb":"/assets/5092af2163e512f0.webp","cover":"/assets/918de84833eeee68.webp","frame":"2600:49682"},{"slug":"anwrk-brand-product","co":"Anwrk","yr":"2024","site":"","title":"Connecting skilled artisans with clients","sub":"","toc":[["Context and Background",1],["Problem",3],["Objective",4],["My Role",6],["Investigation & Enquiry",7],["User Personas",8],["Design Language & Rationale",9],["Solution ~ Key Features",10],["Hi-FI Designs",11],["Validation & Results",17],["Reflection / Learnings",18],["Team Members",20]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Context and Background\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Anwrk was conceived as a digital intervention for the highly fragmented informal service sector in Nigeria. In markets where word-of-mouth is the only currency for hiring, both clients and artisans suffer from a lack of transparency and structure. Clients struggle to find reliable help, while skilled artisans lack the digital presence to reach a wider customer base beyond their immediate physical vicinity.</p><p class=\"tw-leading-[1.5]\">The platform serves as a specialized marketplace connecting users with verified professionals across key verticals such as Electricity, Plumbing, Carpentry, AC Repair and many more. By providing a centralized space for discovery, communication, and secure payments, Anwrk aims to professionalize manual labor and provide a seamless maintenance experience for home and property owners.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"/assets/af4aad1b1a59bbed.webp","w":1243,"h":524,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-min-w-full tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[min-content]\">\n              Discovery Friction and the Trust Deficit\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">The primary hurdle in the local artisan market is a profound \"confidence gap.\" Our research indicated that about majority (about 72%) of clients had experienced inconsistent pricing, while 54% cited safety concerns when inviting unverified workers into their homes. Without a central repository for reviews or credentials, discovery was a game of chance really, often resulting in sub-par work or financial disputes. For artisans, the problem was visibility and payment security. Many skilled craftsmen remained underemployed because they lacked the tools to showcase their portfolios or guarantee that they would be paid once a job was finished. This unorganized system leads to a 45% abandonment rate in the hiring process, as users were often too overwhelmed by the friction of finding a trustworthy professional.</p></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Objective\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Designing for Accountability and Rapid Discovery\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">The primary objective was to reduce the time-to-hire from several days to under five minutes by implementing a high-precision, location-based discovery engine. We aimed to build an ecosystem where every artisan is verified through a rigorous KYC process involving National Identity Numbers (NIN) and utility bill validation, ensuring 100% profile authenticity. Success was also defined by financial transparency. We set out to build a \"Price Lock\" escrow system that protects both parties; securing the client's funds and guaranteeing the artisan's payment upon project completion. The goal was to increase the average artisan’s monthly earnings by about 35% within the first six months by providing them with a verified digital storefront and a robust portfolio tool to showcase their expertise.</p></div></div>","l":"Objective"},{"t":"img","src":"/assets/f9dbe0d7fe596e1d.webp","w":1894,"h":586,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">Lead Product Designer &amp; UX Strategist</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">As the Lead Product Designer, I directed the end-to-end initiative, from ethnographic user research to the delivery of a high-fidelity design system. My responsibilities included defining the information architecture for two distinct user types, Clients and Artisans, ensuring that the transition between discovery and project management was frictionless for both.</p><p class=\"tw-leading-[1.5]\">I also managed the implementation phase, working directly with developers to ensure the complex logic of the digital wallet and the tiered KYC verification flows were executed with UX integrity. My role was as much about strategy as it was about execution, as I had to balance technical constraints with the need for a highly accessible interface for users who may have limited experience with SaaS tools.</p></div></div></div>","l":"My Role"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">Investigation &amp; Enquiry</p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Belling the cat-friction in Manual Labor\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">We didn’t just analyze the hiring funnel; we decoded the emotional triggers behind the market's friction. By reviewing past support logs and conducting field interviews, we found that 62% of disputes were caused by vague verbal agreements that changed during the project. This insight led directly to the development of the \"Project Detail\" and \"Price Lock\" features to serve as a digital contract.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">I also studied global service platforms and local fintech apps to understand how users in emerging markets interact with security features. The investigation revealed that users preferred \"search-first\" interfaces that felt familiar, like Google for example. This led us to move away from complex directories in favor of a clean, intent-driven search experience that prioritized proximity/distance and reputation.</p></div></div></div>","l":"Investigation & Enquiry"},{"t":"img","src":"/assets/8c747afda3f6639a.webp","w":1894,"h":1108,"alt":"User Personas A Client and his Master Craftsman We interviewed and synthesized insights around three typical user groups: Tunde Turner A very busy manager Age:  27 Location:  Lagos, Nigeria About:  Tunde needs an electrician to fix a recurring fault in his Ikeja office. He doesn't have time to haggle or supervise unverified workers. His priority is speed, verified credentials, and the ability to p","l":"User Personas"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">Design Language &amp; Rationale</p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Trust and Simplicity\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">The design language was rooted in Jakob’s Law—using familiar UI patterns to build immediate trust. We utilized a clean, high-contrast palette with clear status indicators to ensure that project states (e.g., \"In Progress,\" \"Completed\") were unmistakable at a glance. This was critical for maintaining transparency in an environment where financial transactions were also occurring between strangers.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Further, we prioritized information density for the Artisan profiles, highlighting the artisan’s \"Projects Completed\" and \"Average Response Time\" to help clients make informed decisions quickly. For the Artisan's view, we designed an \"Insights\" dashboard that visualized growth in earnings and profile views, creating a gamified incentive for them to maintain high service standards.</p></div></div></div>","l":"Design Language & Rationale"},{"t":"img","src":"/assets/e6b0e0e75faa2c0f.webp","w":1894,"h":3334,"alt":"Solution ~  Key Features A Living Support and Service Ecosystem The core solution is the Integrated Chat & Hire Flow. This feature allows for real-time negotiation followed by a \"Price Lock\" mechanism that secures the agreed amount in the Anwrk wallet. This ensures that artisans are entitled to payment once the project is initiated and successfully completed, effectively acting as a sort of escrow","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Hi-FI Designs\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">The final designs emphasize a \"Search-First\" landing page, allowing users to instantly find artisans within a 2km radius. We introduced category filters for Electricity, Plumbing, and more, with advanced sorting options for minimum ratings and verification status to give clients absolute control over who they hire. The project management screens were designed to be a \"single source of truth.\" Every project detail, from the 6-seater oak dining table description to the final NGN100,000 price, is documented and agreed upon before work begins. This design prevents \"scope creep\" and provides a clear path for either party to complete or cancel a project with documented feedback.</p></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"/assets/6b589ca4e04479b6.webp","w":1184,"h":531,"alt":"","l":""},{"t":"img","src":"/assets/ea16c1a27d517d9f.webp","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"/assets/7a9c846dab919d30.webp","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"/assets/3017587a3da5e3da.webp","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"/assets/30cfd6a6090c821d.webp","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"/assets/ff039425ddcc98c3.webp","w":1894,"h":738,"alt":"Validation & Results Tangible Gains in Efficiency and Trust Within the first 8 weeks of launch, Anwrk saw a 41% reduction in hiring friction, as users were able to find and book artisans significantly faster than through traditional methods. The \"Price Lock\" feature was a standout success, resulting in a 62% drop in payment-related disputes compared to our pilot benchmarks. ​ Other key metrics inc","l":"Validation & Results"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Designing for Confidence, Not Just Functionality\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">This project was an insightful reminder that as your user base expands to include those less familiar with software, your design must shift from \"features\" to \"confidence.\" We didn't just build a marketplace; we built a framework for trust. By organizing the platform around familiar search patterns and clear functional nodes, we made the experience feel intuitive rather than intimidating.</p><p class=\"tw-leading-[1.5]\">I learned that in the artisan sector, execution is everything. Managing the implementation directly with developers allowed us to catch usability issues early, particularly in the document upload flow for KYC. This project proved that when you design for the person who wasn't \"born into software,\" you create a more accessible and valuable product for everyone.</p></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              in conclusion\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              I believe Anwrk has successfully bridged the gap between the informal workforce and the modern digital economy. By solving the dual problems of discovery and trust, we have created a platform where quality is rewarded and clients feel secure in their hiring decisions. As the platform scales, the core principles of transparency, verified identity, and secure payments will continue to define the Anwrk experience.\n            </p></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[12px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Damilola Olayiwola - Lead Product Designer/UX Strategist\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Stephanie Ukwade - Junior Product Designer\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Obinna Akpononu - Technical Lead\n            </p></div></div>","l":"team members"}],"thumb":"/assets/c0d474ac478ce688.webp","cover":"/assets/473a72c11ef63a2e.webp","frame":"2600:50224"},{"slug":"vervemobile","co":"Interswitch Group","yr":"2025","site":"","title":"VerveMobile: Bringing mobile connectivity and a wallet into one app","sub":"","toc":[["Context and Background",2],["Solution",4],["Reserach",6],["Design decisions",8],["Iterating with insights",9],["Design system",13],["Final Designs",15],["Reflection / Learnings",19]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-gap-[50px] tw-items-start tw-not-italic tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-text-[14px] tw-w-full\"><div class=\"tw-content-stretch tw-flex tw-flex-[1_0_0] tw-flex-col tw-gap-[15px] tw-items-start tw-min-w-px tw-relative\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-tracking-[-0.56px] tw-uppercase tw-w-full\">\n              MY ROLE\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-tracking-[0.28px] tw-w-full\">\n              Lead Product Designer\n            </p></div><div class=\"tw-content-stretch tw-flex tw-flex-[1_0_0] tw-flex-col tw-gap-[15px] tw-items-start tw-min-w-px tw-relative\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">\n              TIMELINE\n            </p><p class=\"fh4 tw-leading-[1.3] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-tracking-[0.28px] tw-w-[min-content]\">2025 (Q3-Q4) </p></div><div class=\"tw-content-stretch tw-flex tw-flex-[1_0_0] tw-flex-col tw-gap-[15px] tw-items-start tw-min-w-px tw-relative\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">\n              TEAM\n            </p><p class=\"fh4 tw-leading-[1.3] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-tracking-[0.28px] tw-w-[min-content]\">\n              Product Manager, Marketers, Data Analyst\n            </p></div><div class=\"tw-content-stretch tw-flex tw-flex-[1_0_0] tw-flex-col tw-gap-[15px] tw-items-start tw-min-w-px tw-relative\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-tracking-[-0.56px] tw-uppercase tw-w-full\">\n              DELIVERABLES\n            </p><p class=\"fh4 tw-leading-[1.3] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-tracking-[0.28px] tw-w-full\">\n              Mobile Design, Web Design, Website, UX Audit, Product Strategy\n            </p></div></div>","l":"MY ROLE"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-content-stretch tw-flex tw-flex-col tw-gap-[32px] tw-items-start tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0 tw-w-full\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n                Context and Background\n              </p><p class=\"fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[28px] tw-tracking-[-0.28px] tw-w-[887px]\">\n                What if the brand behind your card could also power your phone?\n              </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.16px] tw-w-[887px]\">Verve is one of Africa's most trusted payment brands, with over 70 million cards issued across Nigeria. For years, its role was simple: it helped people pay. VerveMobile is the step beyond that, a standalone app that brings mobile connectivity and financial services into one place.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"/assets/3a9547da2090747d.webp","w":1588,"h":694,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-[977px]\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              SOLUTION\n            </p><p class=\"fh5 tw-leading-[1.4] tw-min-w-full tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[min-content]\">\n              VerveMobile: one app for staying connected and managing money\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              We wanted financial access to feel as everyday and effortless as topping up airtime, so we brought a mobile network, a wallet, payments, and rewards together in one app.\n            </p></div></div>","l":"SOLUTION"},{"t":"img","src":"/assets/2352548e2b10c544.webp","w":1954,"h":3836,"alt":"0 WXYZ 9 TUV 8 PQRS 7 MNO 6 JKL 5 GHI 4 DEF 3 ABC 2   1 9:41 Top Up Airtime Top Up Data Top Up Input Phone Number Select Contact Save as beneficiary Input Amount ₦500 ₦1000 ₦2000 ₦5,000 Continue Buy airtime and data in seconds Top up straight from your wallet, and earn points every time. 9:41 Verve Express Get access to essential services with no sign-in required Buy a SIM Get a Verve Mobile SIM d","l":"0"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-[977px]\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Research\n            </p><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[887px]\">\n              We learned how people expect a super app to be organized...\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              VerveMobile had to hold a mobile network, a wallet, payments, and rewards in one place. Through card sorting, we learned how users naturally grouped these services, and built the navigation around their mental model instead of ours.\n            </p></div></div>","l":"Research"},{"t":"img","src":"/assets/e1c1bc56e453b67a.webp","w":1954,"h":1664,"alt":"he information architecture, built around how users grouped these services","l":"he information architecture, built around how users grouped these services"},{"t":"img","src":"/assets/cb9f1680e4e5755f.webp","w":1243,"h":2977,"alt":"Design decisions We made deliberate calls to keep a complex product simple The decisions that mattered most weren't about what to build, but about what to hold back, what to make optional, and how to lower the barrier to getting started. Financial, without being a bank Regulation meant VerveMobile couldn't present as a fintech bank. Telecom had to lead, and wallet transfers were limited to Verve-t","l":"Design decisions"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-full\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Iterating with insights\n            </p><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[894px]\">\n              Key finding: card linking was the single biggest blocker in usability testing\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              After the core experience was built, we ran usability testing across 15 tasks with real participants covering onboarding, SIM management, data, wallet, and rewards. The app tested well overall, participants called it easy and intuitive, and rated it simpler than established telco apps.\n            </p></div></div>","l":"Iterating with insights"},{"t":"img","src":"/assets/f290b0dc769adb23.webp","w":1649,"h":721,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-full\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[894px]\">\n              ...but the wallet section surfaced the most serious problems\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">Card linking triggered retry errors, and when a \"no name match\" error appeared, it gave no explanation of what had gone wrong. One participant's attempt to send money failed entirely when a zero balance combined with a broken card link left no path forward. These findings shaped what we prioritized next: fixing the card linking flow first, since it blocked the most critical financial actions in the app, and rewriting error states so users understood what happened and what to do next.</p></div></div>","l":"...but the wallet section surfaced the most serious problems"},{"t":"img","src":"/assets/32e24fc9728aaa5c.webp","w":1954,"h":942,"alt":"Critical card linking errors, mapped to where they happened in the app.","l":"Critical card linking errors, mapped to where they happened in the app."},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-full\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Design system\n            </p><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[894px]\">\n              VerveMobile had to feel like Verve without looking like a copy of it.\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">Verve already had an established brand system. We worked within it, borrowing the foundations (color, typography, core components) and building only what VerveMobile needed that didn't already exist. New components for SIM management, wallet flows, and the rewards ecosystem. New artifacts for the telecom layer. The goal was consistency with the parent brand and enough distinctiveness for VerveMobile to feel like its own product.</p></div></div>","l":"Design system"},{"t":"img","src":"/assets/294be7232fe36249.webp","w":1222,"h":1587,"alt":"Design system preview Theme: Fairly Rounded Corners Compact & Bold Typography Youthfully Imagery Flat BGs Vibrant Colors Label 25,000.00 UI and Screen Layout Moodboarding","l":"Design system preview"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-full\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Final designs\n            </p><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[894px]\">\n              We built a simple, functional app\n            </p></div></div>","l":"Final designs"},{"t":"img","src":"/assets/2726587395be1d3e.webp","w":1954,"h":990,"alt":"","l":""},{"t":"img","src":"/assets/5743c8f748de9997.webp","w":977,"h":427,"alt":"Airtime Purchase 13 Jun | 11:04 - 250 pts Bal: 2,000 pts","l":"Airtime Purchase"},{"t":"img","src":"/assets/2726587395be1d3e.webp","w":1954,"h":990,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              What I learned\n            </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[0px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"fh5 tw-leading-[1.5] tw-text-[24px] tw-text-white tw-tracking-[-0.24px]\">Regulation can be a design direction..</span><span class=\"tw-leading-[1.5] tw-text-[16px]\"><br>\n                The telco and CBN rules forced us to lead with telecom and limit transfers to Verve-to-Verve only. At first that felt like a ceiling. By the end it felt like a frame. The limitations made the product more focused, not less, and working within them honestly produced something cleaner than designing around their edges would have.\n              </span></p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[0px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"fh5 tw-leading-[1.5] tw-text-[24px] tw-text-white tw-tracking-[-0.24px]\">The barrier to entry is a product decision.</span><span class=\"tw-leading-[1.5] tw-text-[16px]\"><br>\n                Letting users get a number before signing in wasn't a UX fix. It was a statement about what the product values, that people should experience the value before being asked to commit. That belief shaped more than the onboarding flow. It shaped how we thought about every first interaction in the app.\n              </span></p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[0px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"fh5 tw-leading-[1.5] tw-text-[24px] tw-text-white tw-tracking-[-0.24px]\">Inconclusive data is still data.</span><span class=\"tw-leading-[1.5] tw-text-[16px]\"><br>\n                Our A/B test came back close. The instinct was to pick the higher score and move on. The real insight was that neither direction alone was right, and synthesizing both was the harder, more honest call. Research doesn't always point at an answer. Sometimes it points at a better question.\n              </span></p></div></div>","l":"reflection / Learnings"}],"thumb":"/assets/d4b599f28f7f814b.webp","cover":"/assets/cf6a5c10ad02df44.webp","frame":"2980:70996"},{"slug":"quickteller-remit","co":"Interswitch Group","yr":"2025","site":"","title":"QuickTeller Remit: an international remittance experience for the African diaspora","sub":"","toc":[["Context and Background",3],["Solution",6],["Challenge",5],["Solution",6],["Design Decisions",8],["Iterations",9],["Final Designs",10],["Reflection / Learnings",16]],"secs":[{"t":"hr"},{"t":"img","src":"/assets/b573111683a28f8e.webp","w":1954,"h":1040,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-gap-[50px] tw-items-start tw-not-italic tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-text-[14px] tw-w-full\"><div class=\"tw-content-stretch tw-flex tw-flex-[1_0_0] tw-flex-col tw-gap-[15px] tw-items-start tw-min-w-px tw-relative\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-tracking-[-0.56px] tw-uppercase tw-w-full\">\n              MY ROLE\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-tracking-[0.28px] tw-w-full\">\n              Lead Product Designer\n            </p></div><div class=\"tw-content-stretch tw-flex tw-flex-[1_0_0] tw-flex-col tw-gap-[15px] tw-items-start tw-min-w-px tw-relative\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">\n              TIMELINE\n            </p><p class=\"fh4 tw-leading-[1.3] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-tracking-[0.28px] tw-w-[min-content]\">2025 (Q3-Q4) </p></div><div class=\"tw-content-stretch tw-flex tw-flex-[1_0_0] tw-flex-col tw-gap-[15px] tw-items-start tw-min-w-px tw-relative\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">\n              TEAM\n            </p><p class=\"fh4 tw-leading-[1.3] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-tracking-[0.28px] tw-w-[min-content]\">\n              Product Manager, Marketers, Data Analyst\n            </p></div><div class=\"tw-content-stretch tw-flex tw-flex-[1_0_0] tw-flex-col tw-gap-[15px] tw-items-start tw-min-w-px tw-relative\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-tracking-[-0.56px] tw-uppercase tw-w-full\">\n              DELIVERABLES\n            </p><p class=\"fh4 tw-leading-[1.3] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-tracking-[0.28px] tw-w-full\">\n              Mobile Design, Web Design, Website, UX Research\n            </p></div></div>","l":"MY ROLE"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-content-stretch tw-flex tw-flex-col tw-gap-[32px] tw-items-start tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0 tw-w-full\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n                Context and Background\n              </p><p class=\"fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[28px] tw-tracking-[-0.28px] tw-w-[887px]\">QuickTeller Remit was Interswitch's move into international remittance, covering four corridors from the UK to Africa.</p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.16px] tw-w-[887px]\">\n                QuickTeller Remit is an Interswitch product, part of the broader QuickTeller ecosystem, built following the acquisition of an IMTO license. It covers four corridors from the UK to Nigeria, Uganda, Kenya, and Ghana, giving Africans in the diaspora a way to send money home, pay bills for family, and manage finances across borders.\n              </p></div></div></div>","l":"Context and Background"},{"t":"img","src":"/assets/78ad45c70f7f7a5d.webp","w":1954,"h":854,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-content-stretch tw-flex tw-flex-col tw-gap-[32px] tw-items-start tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0 tw-w-full\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n                challenge\n              </p><p class=\"fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[28px] tw-tracking-[-0.28px] tw-w-[887px]\">\n                How might we build a compliant remittance experience for Africans in the UK, in a heavily regulated space, without making the product feel like a compliance exercise?\n              </p></div></div></div>","l":"challenge"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-[977px]\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0 tw-w-[947px]\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              SOLUTION\n            </p><p class=\"fh5 tw-leading-[1.4] tw-min-w-full tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[min-content]\">\n              QuickTeller Remit: send money, pay bills, and track your finances across borders.\n            </p></div></div>","l":"SOLUTION"},{"t":"img","src":"/assets/b1ec7392be6db34a.webp","w":1954,"h":2872,"alt":"Send money home Transfer funds across four corridors, UK to Nigeria, Uganda, Kenya, and Ghana, quickly and securely. Check rates before you sign in See live exchange rates without creating an account, so you know what you're getting before you commit. Pay bills for family back home Pay utility bills, school fees, and other expenses for family in Nigeria, Uganda, Kenya, and Ghana, directly from the","l":"Send money home"},{"t":"img","src":"/assets/1426ce5b71a2a0b5.webp","w":1362,"h":2752,"alt":"Design decisions Three decisions shaped how the product came together Working within a regulated space, an existing ecosystem, and a specific user need meant every decision involved a real tradeoff. Rates before you commit Most remittance apps make you create an account before showing you anything. We made exchange rates visible without signing in. The risk was that users might check rates and nev","l":"Design decisions"},{"t":"img","src":"/assets/bb47b987f710f5d5.webp","w":1894,"h":3294,"alt":"iterations Not every first approach was the right one. Here's where the work changed. We couldn't decide when to show the exchange rate breakdown... We explored two ways to present the exchange rate breakdown during a transfer. Required users to tap a button to see the breakdown, then go back to complete the transfer. Added an unnecessary step between the user and their goal.\" Showed the breakdown","l":"iterations"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-full\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Final designs\n            </p><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[894px]\">\n              We built it to feel trustworthy, clear, and fast.\n            </p></div></div>","l":"Final designs"},{"t":"img","src":"/assets/d3f27e533b6b2aa6.webp","w":1954,"h":854,"alt":"","l":""},{"t":"img","src":"/assets/03264be8b42a021c.webp","w":1954,"h":854,"alt":"","l":""},{"t":"img","src":"/assets/8bb4600539c14eba.webp","w":1100,"h":481,"alt":"","l":""},{"t":"img","src":"/assets/51e2cf64941546d6.webp","w":1161,"h":507,"alt":"","l":""},{"t":"img","src":"/assets/cfdb342b23451716.webp","w":977,"h":427,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              What I learned\n            </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-te
