vertising, and supporting visual elements. Messaging such as “Trust the flow,” “Fast rails for a connected economy,” and “One API. Infinite movement.” translates the underlying infrastructure into a proposition that is easier to understand: complex systems working together so money can move more freely.</p></div>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/c69527e0ac4812b2.webp\" width=\"1896\" height=\"1134\" alt=\"‘Liquidity in every drop’ campaign graphic\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/cd0b39dc42ddf408.webp\" width=\"1896\" height=\"1218\" alt=\"‘Trust the flow’ poster and staff ID badges\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/4d5d204d327aed2d.webp\" width=\"1896\" height=\"1134\" alt=\"Brand moodboard: ‘Cross-border payments, anchored in trust’\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/ad954b160d072c9b.webp\" width=\"1896\" height=\"1134\" alt=\"Teams and permissions on a laptop\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/7dbbd687dd183f8d.webp\" width=\"1896\" height=\"1218\" alt=\"3D growth illustration and line icons\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/ab4d2fafc5094612.webp\" width=\"1896\" height=\"1134\" alt=\"Wallets dashboard on a desktop monitor\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/3d274340a3168050.webp\" width=\"1896\" height=\"1134\" alt=\"‘Powering the world’s leading fintechs’ bus-shelter billboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Brand principle:</p><h2 class=\"fx-h\" style=\"line-height:1.3\">Trust the flow.</h2><p class=\"fx-p\">The result is a visual identity that treats financial infrastructure not as an invisible technical layer, but as an essential enabler of connection, growth, and global commerce. It gives Rivr a coherent presence across a complex category while keeping its central promise in focus: make financial movement faster, more connected, and easier to trust.</p></div></div>","l":"Reflection / Learnings"}],"frame":"v3","thumb":"/assets/ea40fced956b4c4b.webp","cover":"/assets/ea40fced956b4c4b.webp"},{"slug":"dropcart-branding","co":"Dropcart for Altovida","yr":"2026","site":"","title":"Convenience with an appetite for more. Branding a shopping experience designed to keep things moving","sub":"","toc":[["Context and Background",1],["Design presentation",6],["Reflection / Learnings",25]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Context and Background</p><p class=\"fx-p\">DropCart was built around a familiar modern desire: getting what you want, when you want it, without making the process harder than it needs to be. Bringing shopping and delivery into a single digital experience, the brand needed to make convenience feel less transactional and more like a natural part of everyday life.</p><p class=\"fx-p\">The identity takes a simple premise: tap, relax, and let it arrive, and gives it an unmistakable visual personality. Rather than leaning on the restrained visual conventions common to commerce platforms, the direction embraces bold colour, expressive typography, playful illustration, and a more energetic approach to communication.</p></div></div>","l":"Context and Background"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/746d81107738a2ba.webp\" width=\"1950\" height=\"1040\" alt=\"Dropcart wordmark with illustrated produce\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-meta\"><div><p class=\"fx-l\">My role</p><p>Brand Designer, Brand Strategist</p></div><div><p class=\"fx-l\">Timeline</p><p>2026 (Q1-Q3)</p></div><div><p class=\"fx-l\">Team</p><p>Solo Project</p></div><div><p class=\"fx-l\">Deliverables</p><p>Brand Design, Logo design, Brand Strategy, Visual Identity, Art Direction, Campaign Design, Brand Applications, iconography &amp; Illustrations</p></div></div>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/4166eff25db5c342.webp\" width=\"1950\" height=\"1134\" alt=\"Logo concept #1: a cart built from a directional arrow and a smile\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/2ee7d56badb50491.webp\" width=\"1950\" height=\"1134\" alt=\"Approved concept: the location pin as the letter D\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><p class=\"fx-p\">The logo combines a location-pin reference with a custom geometric form, connecting the ideas of discovery, delivery, and arrival. This symbol becomes the foundation of a broader graphic system: repeated motifs, oversized brand shapes, distinctive framing devices, and supporting illustrations that create consistency across otherwise varied applications.</p><p class=\"fx-p\">Cobalt blue establishes a strong, recognisable foundation, while electric lime delivers contrast and immediacy. A wider palette introduces additional warmth and flexibility, particularly across food-led imagery and promotional campaigns. Bold typography keeps messages legible and assertive, while illustrated produce, food assets, and expressive visual compositions bring personality to the experience.</p></div>","l":"Design presentation"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/286395d34dab4083.webp\" width=\"1950\" height=\"1134\" alt=\"‘Your order is on its way’ campaign photo\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/e3ad7bf3f3c3fd5f.webp\" width=\"1950\" height=\"1134\" alt=\"Dropcart colour palette\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><p class=\"fx-p\">The identity was developed across digital interfaces, app-related assets, packaging, shopping bags, apparel, merchandise, social media, and outdoor advertising. Campaign expressions such as “Zero effort. Maximum satisfaction.” and “Total convenience. One app. DropCart does it all.” translate the brand’s proposition into everyday moments: late-night cravings, spontaneous purchases, and the comfort of having what you need delivered.</p></div>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/2b6ff0e85a8fcca4.webp\" width=\"1950\" height=\"1134\" alt=\"‘Total satisfaction, delivered’ billboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/195a6b28ae3072b8.webp\" width=\"1950\" height=\"1218\" alt=\"Typefaces: Anybody and Gilmer\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/130b91c585c3fa84.webp\" width=\"1950\" height=\"1134\" alt=\"Produce illustrations, badge shapes and stickers\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/b95e48a4a00a545e.webp\" width=\"1950\" height=\"1134\" alt=\"‘Dropcart it today’ campaign photo\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/9de12245523a5341.webp\" width=\"1950\" height=\"1218\" alt=\"Branded cap, flag and subway posters\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/47c526205bc15425.webp\" width=\"1950\" height=\"1134\" alt=\"Social posts\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/8fa7956b93de30d6.webp\" width=\"1950\" height=\"1218\" alt=\"Campaign photo and a branded delivery backpack\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/6229d378cecb3c84.webp\" width=\"1950\" height=\"1134\" alt=\"Laptop stickers\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/0c07fe630bc69974.webp\" width=\"1950\" height=\"1134\" alt=\"Instagram posts\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/a70e820e23880170.webp\" width=\"1950\" height=\"1218\" alt=\"Shopping bag and a ‘Five-star cravings’ poster\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><p class=\"fx-p\">The strategic intent was to make the service feel both useful and desirable — communicating functional convenience while building an identity with enough personality to stand apart in a crowded category.</p></div>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/c2bd9f7c35c48685.webp\" width=\"1950\" height=\"1134\" alt=\"The Dropcart app’s orders screen in hand\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/56dd1be57e766507.webp\" width=\"1950\" height=\"1218\" alt=\"Campaign photo, the app’s favourites screen and a ‘Late-night cravings’ billboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/12e507a7c35169f0.webp\" width=\"1950\" height=\"1134\" alt=\"‘Dropcart brings the city’s finest pasta to your couch’ banner\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/b837a820e85d15a3.webp\" width=\"1950\" height=\"1134\" alt=\"Branded bucket hat\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Brand principle:</p><h2 class=\"fx-h\" style=\"line-height:1.3\">Total convenience. One app.</h2><p class=\"fx-p\">The result is a distinctive commerce identity that turns an everyday utility into a more expressive brand experience, making convenience feel immediate, familiar, and worth coming back to.</p></div></div>","l":"Reflection / Learnings"}],"frame":"v3","thumb":"/assets/746d81107738a2ba.webp","cover":"/assets/746d81107738a2ba.webp"},{"slug":"drop-branding","co":"Drop for Altovida","yr":"2026","site":"","title":"Movement, made effortless. Creating a unified identity for mobility and delivery services.","sub":"","toc":[["Context and Background",1],["Design presentation",5],["Reflection / Learnings",27]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Context and Background</p><p class=\"fx-p\">Mobility is more than getting from one place to another. It is what movement makes possible: the plans we keep, the places we discover, the work we get done, and the freedom to do more with our time.</p><p class=\"fx-p\">Drop was conceived around this idea. A mobility and logistics brand built to make everyday movement and delivery feel more connected, accessible, and effortless. The identity needed to communicate speed and utility without losing the human energy of the experiences it enables.</p></div></div>","l":"Context and Background"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/7458fdd7f7d56b7f.webp\" width=\"1950\" height=\"1040\" alt=\"Drop wordmark on concentric lines\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-meta\"><div><p class=\"fx-l\">My role</p><p>Brand Designer, Brand Strategist</p></div><div><p class=\"fx-l\">Timeline</p><p>2026 (Q1-Q3)</p></div><div><p class=\"fx-l\">Team</p><p>Solo Project</p></div><div><p class=\"fx-l\">Deliverables</p><p>Brand Design, Logo design, Brand Strategy, Visual Identity, Art Direction, Campaign Design, Brand Applications, iconography &amp; Illustrations</p></div></div>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/fbaa26c1b65dcdf9.webp\" width=\"1950\" height=\"1134\" alt=\"Logo concept: the map pin as the letter D\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><p class=\"fx-p\">The central design decision was to turn the idea of a destination into a distinctive brand asset. The symbol combines the familiar language of a map pin with a custom geometric form, creating a mark that feels ownable while remaining rooted in the universal idea of getting somewhere. It gives the brand a visual shorthand for movement, direction, and arrival.</p></div>","l":"Design presentation"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/84da738b32ee9558.webp\" width=\"1950\" height=\"1134\" alt=\"Pixel keyring: ‘Move more, live more’\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/e9ad46fb9d4bb547.webp\" width=\"1950\" height=\"1218\" alt=\"Driver app on a phone and a pixel app icon\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/2352f0d0911eacea.webp\" width=\"1950\" height=\"1134\" alt=\"Drop colour palette\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><p class=\"fx-p\">A vivid electric-lime accent against deep green, cobalt blue, and black creates immediate recognition. Bold condensed typography brings urgency and presence, while a modular graphic language draws from the symbol’s geometry to create patterns, framing devices, and repeatable compositions. Pixel-inspired illustrations of vehicles, navigation cues, and logistics objects give the identity a playful, digital-native character.</p><p class=\"fx-p\">The system extends across social campaigns, outdoor advertising, digital touchpoints, merchandise, apparel, and transport-related applications. Across these formats, the brand voice is direct, energetic, and action-oriented. Messages such as “Book. Ride. Go.” and “Move more. Live more.” reduce the proposition to simple actions and the possibilities they unlock.</p></div>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/69eb92a231aad9b7.webp\" width=\"1950\" height=\"1134\" alt=\"‘Use Drop’ underground billboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/94625c1689dbe70c.webp\" width=\"1950\" height=\"1218\" alt=\"Typefaces: Anybody and Gilmer\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/bfa10b7ca2bf11c9.webp\" width=\"1950\" height=\"1134\" alt=\"Pixel 3D icons\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/5b50a429d89dac5d.webp\" width=\"1950\" height=\"1218\" alt=\"‘Take a Drop’ poster and ride booking in hand\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/47a469b538738a74.webp\" width=\"1950\" height=\"1134\" alt=\"In-ride driver rating\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/75df8f848a51fd7e.webp\" width=\"1950\" height=\"1218\" alt=\"Phone case, rider and branded bicycle\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><p class=\"fx-p\">Rather than treating logistics as a purely functional service, the identity positions Drop around the freedom that reliable movement creates.</p></div>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/ba18b4a2947dfe69.webp\" width=\"1950\" height=\"1134\" alt=\"Instagram posts\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/edebe940eb82b6d9.webp\" width=\"1950\" height=\"1218\" alt=\"Branded T-shirt and a watch app icon\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/edd4411232b79a50.webp\" width=\"1950\" height=\"1134\" alt=\"‘Make plans. Not excuses.’ billboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/0efbaa7f3a071812.webp\" width=\"1950\" height=\"1134\" alt=\"‘Weekend starts now’ social graphic\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/b4716b31684a0670.webp\" width=\"1950\" height=\"1218\" alt=\"Brand pin and a ‘Book. Ride. Go.’ building wrap\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/875a6e909ae7d942.webp\" width=\"1950\" height=\"1134\" alt=\"Bus-stop posters\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/ab58a9a0bf2de5d0.webp\" width=\"1950\" height=\"1218\" alt=\"Tote bag, campaign photo and office signage\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/66863ec3f93523c3.webp\" width=\"1950\" height=\"1218\" alt=\"Pixel car, bucket hat with pins and a ‘Your city. Your plans.’ poster\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/d53d7be3e95e6055.webp\" width=\"1950\" height=\"1134\" alt=\"Social profiles\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/b204c1f323175283.webp\" width=\"1950\" height=\"1218\" alt=\"Delivery rider and a branded T-shirt\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Brand principle:</p><h2 class=\"fx-h\" style=\"line-height:1.3\">Move more. Live more.</h2><p class=\"fx-p\">The result is a bold, adaptable identity that gives movement a recognisable character — making the brand feel as dynamic as the people and places it connects.</p></div></div>","l":"Reflection / Learnings"}],"frame":"v3","thumb":"/assets/7458fdd7f7d56b7f.webp","cover":"/assets/7458fdd7f7d56b7f.webp"},{"slug":"altovida-branding","co":"Altovida · Parent brand","yr":"2026","site":"","title":"Building the foundations for what’s next.","sub":"","toc":[["Context and Background",1],["Design presentation",5],["Reflection / Learnings",27]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Context and Background</p><p class=\"fx-p\">Altovida builds the infrastructure that makes better business possible. Working across technology, secure cloud, cybersecurity, financial infrastructure, and digital solutions, the brand needed an identity capable of bringing a broad and ambitious proposition into focus.</p><p class=\"fx-p\">The challenge was to create a visual language that felt credible in complex, high-stakes industries without defaulting to the predictable codes of enterprise technology. The result is an identity built around a simple idea: the right foundations create the conditions for greater possibilities.</p></div></div>","l":"Context and Background"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/029027a87a711bad.webp\" width=\"1950\" height=\"1040\" alt=\"Altovida signage on a building\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-meta\"><div><p class=\"fx-l\">My role</p><p>Brand Designer, Brand Strategist</p></div><div><p class=\"fx-l\">Timeline</p><p>2026 (Q1-Q3)</p></div><div><p class=\"fx-l\">Team</p><p>Solo Project</p></div><div><p class=\"fx-l\">Deliverables</p><p>Brand Design, Logo design, Brand Strategy, Visual Identity, Art Direction, Campaign Design, Brand Applications, iconography &amp; Illustrations</p></div></div>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/69a7340891260202.webp\" width=\"1950\" height=\"1134\" alt=\"Concept note: Ananse Ntontan, the spider’s web\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><p class=\"fx-p\">At the centre of the system is a distinctive symbol inspired by Ananse Ntontan — the spider’s web, an Adinkra symbol associated with creativity and wisdom. Reinterpreted through the lens of interconnected infrastructure, the mark represents the relationships between systems, industries, and opportunities. Its radial form becomes a recognisable anchor for a brand whose work is fundamentally about connecting what makes progress possible.</p></div>","l":"Design presentation"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/857f80c9b0099291.webp\" width=\"1950\" height=\"1134\" alt=\"Altovida logo and other adaptations\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/8d32ffa942e0b6ae.webp\" width=\"1950\" height=\"1134\" alt=\"Altovida logo in colour\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/749f6c833f38b45d.webp\" width=\"1950\" height=\"1134\" alt=\"Colour palette\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><p class=\"fx-p\">A high-contrast palette of electric violet, deep black, and luminous green establishes a confident, contemporary presence. Condensed typography brings precision and character, while dimensional visual assets translate abstract infrastructure into tangible expressions of security, connectivity, and progress.</p><p class=\"fx-p\">The identity was developed as a system rather than a standalone logo. Logo variations, sector-specific expressions, graphic patterns, 3D assets, social templates, environmental graphics, stationery, merchandise, and digital applications demonstrate how the brand can maintain a consistent core while adapting across finance, agriculture, mobility, energy, housing, and ventures.</p></div>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/8b0e7afd4a3aca0a.webp\" width=\"1950\" height=\"1218\" alt=\"Bus-shelter poster and a branded sweatshirt\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/be310117a94f98b2.webp\" width=\"1950\" height=\"1134\" alt=\"Typefaces: Geist and Geist Mono\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/efca4c2767c2f4b6.webp\" width=\"1950\" height=\"1134\" alt=\"‘Building what makes better possible’ billboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/44512fb6ca602140.webp\" width=\"1950\" height=\"1218\" alt=\"Keyring and business cards\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/0d7e4eb2c0183eae.webp\" width=\"1950\" height=\"1134\" alt=\"Pattern and gradient brand graphics\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/749233e599faac3f.webp\" width=\"1950\" height=\"1134\" alt=\"‘Better finance starts with better infrastructure’ billboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/e564fc8af8bb0059.webp\" width=\"1950\" height=\"1218\" alt=\"Tote bag, event stage and letterhead\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/2ea7d370ed960fe4.webp\" width=\"1950\" height=\"1134\" alt=\"The symbol in 3D materials\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/0632795b5e6e31b4.webp\" width=\"1950\" height=\"1134\" alt=\"‘Move. Grow. Build.’ building billboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/fd72be6bba32348e.webp\" width=\"1950\" height=\"1218\" alt=\"Sector posters, fleece and wall signage\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/aadd0ea976d704b1.webp\" width=\"1950\" height=\"1134\" alt=\"Instagram posts\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/b8e3147dcb2a3596.webp\" width=\"1950\" height=\"1134\" alt=\"Altovida Ventures billboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/1df9eecedd30865a.webp\" width=\"1950\" height=\"1218\" alt=\"Cap and 3D coin\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/c0f784fe710d5bbd.webp\" width=\"1950\" height=\"1134\" alt=\"Photography direction\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/731fd1c9feece761.webp\" width=\"1950\" height=\"1218\" alt=\"Social profile, ID badges and roll-up banners\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/409d6ca34df9446b.webp\" width=\"1950\" height=\"1218\" alt=\"Hard hat and water bottle\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"/assets/707f76e21ab82b6f.webp\" width=\"1950\" height=\"1134\" alt=\"App icon\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Brand principle:</p><h2 class=\"fx-h\" style=\"line-height:1.3\">Better foundations. Greater possibilities.</h2><p class=\"fx-p\">The result is a brand designed to make complexity feel coherent, connecting a diverse portfolio of capabilities under one clear idea: innovation that elevates.</p></div></div>","l":"Reflection / Learnings"}],"frame":"v3","thumb":"/assets/029027a87a711bad.webp","cover":"/assets/029027a87a711bad.webp"}];for(const v of B3){const i=CASES.findIndex(c=>c.slug===v.slug);if(i>=0)CASES[i]=Object.assign({},CASES[i],v);else CASES.push(v);}})();

(() => {
  const DS_SRC = [{"track": "design-system", "slug": "renny-design-system", "client": "Renmoney MFB", "year": "2024", "category": "p", "status": "complete", "isDraft": false, "title": "Renny: Renmoney Design System", "intro": "Renny wasn't commissioned as a project. It grew out of shipping. In my first year at Renmoney, every flow we delivered left behind a reusable decision, and I turned those decisions into a token-driven system: 215 variables, 38 components and the documentation and release process to keep it from drifting.", "roles": ["Product Design Lead", "Design System Lead", "UX Audit", "Accessibility", "Documentation", "Governance"], "glance": [{"value": "215", "label": "Scoped variables, Light, Dark, Mobile and Desktop"}, {"value": "38", "label": "Token-bound components"}, {"value": "27 → 8", "label": "Corner radii"}, {"value": "4.24 → 5.72:1", "label": "Secondary text contrast on sand"}], "cover": {"slot": "DS-01", "src": "/assets/dc0098df26cfb776.webp", "alt": "Renny cover: the smallest units of Renmoney, with 215 tokens, 38 components, 47 icons and 13 shipped flows audited.", "w": 2880, "h": 1620}, "sections": [{"id": "context", "heading": "Context and background", "body": ["Renmoney is a Nigerian microfinance bank whose app brings four money products into one place: Renflex (flexible savings), RenVault (fixed savings), Smart Goals (target savings) and Loans, alongside transfers, bill payments, cards and account management, on mobile and web.", "When I joined, the product had a distinctive visual voice: a warm sand canvas instead of clinical white, near-black ink, pill-shaped actions and a hard offset shadow that made buttons feel like stamped objects. What it didn't have was a system underneath. Each new flow re-decided the basics.", "Renny grew organically during my first year. There was no dedicated system team or roadmap slot, so the system was built inside product work: every time a flow shipped (Onboarding, Spend, Savings, Loans, Add Money, More, Cards), the patterns it proved were promoted into the library."]}, {"id": "role", "heading": "My role", "body": ["Product Design Lead at Renmoney. I led the system and designed the flows it was extracted from."]}, {"id": "audit", "heading": "Problem", "body": ["Building organically has a cost: by the time the flows existed, so did the drift. Midway through the year I audited every hi-fi page we had shipped, about 3,576 top-level frames and 219,000 layers, measuring colour, type, radius, spacing and component usage."], "list": ["Colour: more than 20 near-duplicate greys and blacks were applied as raw hex values. Our first-pass variable set of 198 tokens had never been bound to a layer, every token was unscoped, Red/100 actually stored a grey, and Green/600 duplicated Green/700.", "Type and shape: 21 font sizes across 7 font families, with body text as small as 5px, 6px and 8px, and 27 different corner radii.", "Components: about 1,200 instances carried generic names like \"Group 54776\" and \"Component 23\", and one \"Pills\" component had been stretched across roughly 7,960 uses as chip, tag and filter alike.", "Accessibility: the two most-used supporting text colours failed WCAG AA on the sand canvas. Secondary grey measured 4.24:1 and the field-label slate 3.90:1, against a 4.5:1 requirement."], "images": [{"slot": "DS-02", "src": "/assets/493f646de6f87058.webp", "caption": "What we inherited, counted: 3,576 frames, 219k layers, 198 tokens bound to nothing.", "w": 3008, "h": 1376}, {"slot": "DS-03", "src": "/assets/aabd812206f26737.webp", "caption": "Before and after, row by row. Every decision traces back to a measured problem.", "w": 3008, "h": 1794}]}, {"id": "architecture", "heading": "Approach", "body": ["Extract, don't invent. Every decision in Renny traces back to something we had already shipped and measured. The brand users knew stayed intact; the work was making it repeatable."], "cards": [{"title": "🔑 Three-tier tokens", "body": "81 primitives (sand, ink and the product colours) sit hidden behind 54 semantic colour roles such as bg/canvas, text/secondary, action/accent/bg and product/renvault, and layers only ever use the roles. Colour has Light and Dark modes, and spacing and type have Mobile and Desktop modes. All 215 variables are scoped and carry web, iOS and Android code names."}, {"title": "🔑 Rationalised foundations", "body": "27 radii became 8 tokens. 21 sizes became 18 text styles on one scale with a 10px floor. The signature hard shadow became three effect styles. The two failing text colours were darkened at the token level, to 5.72:1 and 5.43:1, so every component inherited the fix."}, {"title": "🔑 Products own colours", "body": "Renflex is blue, RenVault yellow, Smart Goal green and Loans orange: across marks, progress bars, tints and tags. Colour became wayfinding."}, {"title": "🔑 Components that encode decisions", "body": "38 token-bound components, from Button and Input Field to Balance Card, Summary Card, PIN Confirmation and Result Status. Kobo is de-emphasised so the naira value reads first. Fees appear before the PIN, never after. Pending is never shown as Success."}], "images": [{"slot": "DS-04", "src": "/assets/279f428709a363f6.webp", "caption": "Two brand faces through variables: Uxum Grotesque for display, PP Neue Montreal for everything else.", "w": 3008, "h": 1188}, {"slot": "DS-05", "src": "/assets/895f282fe504211f.webp", "caption": "One component, two modes. Only the frame's Color mode changes; Dark is a setting, not a redesign.", "w": 3008, "h": 1382}]}, {"id": "patterns", "heading": "Documentation as product", "body": ["Every component page shows usage, its full property API, an auto-generated list of the tokens it consumes, and do/don't examples. A Patterns page rebuilds the core money-movement flow (input, review + PIN, result) and three hub screens using only library instances, as proof the system holds real product."], "images": [{"slot": "DS-06", "src": "/assets/4b7dd2ae0b057b80.webp", "caption": "Money movement: input, review + PIN, result. The backbone of Spend, Add Money, Loan repayment and Savings funding.", "kind": "preview", "w": 3008, "h": 2560}]}, {"id": "release", "heading": "Release phases", "steps": [{"title": "Phase 1 · Foundations", "body": "Colour, type and spacing tokens captured from Onboarding and Home."}, {"title": "Phase 2 · Money movement", "body": "Input Field, Amount Chip, Summary Card, PIN Confirmation and Result Status, proven on Spend and Add Money."}, {"title": "Phase 3 · Products", "body": "Balance Card, Product Card, Progress Bar and product colour roles, rolled into Savings and Loans."}, {"title": "Phase 4 · Scale", "body": "Desktop modes, the web side navigation, Dark mode, accessibility fixes and full documentation."}], "body": ["Progressive releases, not a big-bang launch. Each release followed the same update loop: semantic versioning (major for breaking renames, minor for new components or variants, patch for visual fixes), release notes in the library's changelog, and deprecated parts kept working for one minor version, so product files could update on their own schedule instead of breaking mid-sprint. Legacy tokens were retired through a published migration map from the original 198 variables."], "images": [{"slot": "DS-07", "src": "/assets/98583146f8e8e6b8.webp", "caption": "Release notes: v1.0.0 against the legacy v0.9.0 library, with a migration map.", "w": 3008, "h": 1250}]}, {"id": "results", "heading": "Outcome", "body": ["Renny v1.0 replaced an unbound, unscoped first-pass library with 215 scoped variables, 27 text styles, 5 effect styles, 38 components and 47 icons. A structural audit found no hard-coded colours inside any component. Dark theme exists as a mode switch rather than a redesign."], "compare": {"before": ["198 variables, none bound, all unscoped", "20+ near-duplicate greys as raw hex", "21 font sizes, 7 families, body text down to 5px", "27 corner radii", "~1,200 generically named instances", "Secondary text 4.24:1, field labels 3.90:1"], "after": ["215 scoped variables with web, iOS and Android names", "81 primitives behind 54 semantic roles", "18-style scale with a 10px floor, 2 families", "8 radius tokens", "38 purpose-named components", "5.72:1 and 5.43:1, both passing AA"]}}, {"id": "governance", "heading": "Governance", "body": ["Governance keeps it from drifting again: a five-step contribution model (propose, review, build, document, release), versioned releases with changelogs, and four health metrics tracked per release: adoption, detach rate, hard-coded colours and AA coverage."]}, {"id": "team", "heading": "Team members", "list": ["Damilola Olayiwola: Product Design Lead and design system owner"]}]}, {"track": "design-system", "slug": "current-design-system", "client": "Altovida · Rivr", "year": "2026", "category": "p", "status": "complete", "isDraft": false, "title": "Current: the Rivr Design System", "intro": "Rivr is Altovida's web platform for cross-border payments, collections and identity checks. Only 19 of its 5,564 text layers used a style. I built Current out of the shipped product: 226 scoped variables in Light and Dark with a Compact density mode, 37 components, and a dark-mode primary button that went from 2.90:1 to 6.96:1.", "roles": ["Lead Product Designer", "Design System Lead", "UX Audit", "Accessibility", "Documentation", "Governance"], "glance": [{"value": "226", "label": "Scoped variables, Light, Dark and Compact"}, {"value": "37", "label": "Token-bound components"}, {"value": "13 → 8", "label": "Corner radii"}, {"value": "2.90 → 6.96:1", "label": "Dark primary button contrast"}], "cover": {"slot": "DS-01", "src": "/assets/42b33e27a8eb993b.webp", "alt": "Current cover: the Rivr design system name beside a wallet dashboard built from its components.", "w": 2880, "h": 1620}, "sections": [{"id": "context", "heading": "Context and background", "body": ["Rivr serves businesses that move money across borders. Operators hold balances in several currencies, initiate payouts, collect from customers, run identity checks through Authra, and hand developers keys and webhooks. It is a dense, table-heavy web product where a wrong number has a real cost.", "I also designed the Rivr brand, so the visual language was already distinct: deep blue, a confident display face, wallets that each carry their own colour. What the product lacked was the layer underneath. Tokens existed as an export from an earlier Altovida file, but they could be applied anywhere, error was stored as yellow, and new screens kept re-deciding type and spacing by eye."]}, {"id": "role", "heading": "My role", "body": ["Lead product designer and super IC, working with a few supporting designers. I designed the product and the brand, ran the audit, defined the token architecture, built and documented the component library, and set the release and contribution model. Supporting designers built screens on each release and flagged gaps."]}, {"id": "audit", "heading": "Problem", "body": ["I scripted an audit of the Rivr product page and its supporting pages: 11 sections, 46 desktop screens and 23,647 layers, covering onboarding, wallets, payouts, collections, identity, developer tools and settings."], "list": ["Colour: 3,518 of 15,069 fills were raw hex (23%), across 51 unique values. 201 legacy variables, all set to every scope, with light and dark as semantic/light/* and semantic/dark/* name pairs, no border or icon roles, error stored as yellow and success as blue.", "Type and shape: 19 of 5,564 text layers used a style and none were local. 5 families, 13 sizes from 6px to 96px, and 13 corner radii.", "Components: 103 components with generic names, and the full Phosphor icon library (1,248 sets in 6 weights) living in the file.", "Accessibility: tertiary text 2.55:1, placeholders 1.97:1, the Authra wallet 3.36:1 and the dark-mode primary button 2.90:1."], "images": [{"slot": "DS-02", "src": "/assets/55f41241c5fee672.webp", "caption": "What we inherited, counted: 23,647 layers, 201 unscoped variables, 19 styled text layers.", "w": 3008, "h": 1440}, {"slot": "DS-03", "src": "/assets/1aada333b0b02e23.webp", "caption": "Before and after, row by row. Every change maps to a measured problem.", "w": 3008, "h": 1934}]}, {"id": "principles", "heading": "Principles", "body": ["Four rules that settle arguments: Money state is never ambiguous. Rate, fee and balance before commitment. Products own colours. Built for operators."], "images": [{"slot": "DS-04", "src": "/assets/bba9e09d32a883b6.webp", "caption": "Four principles drawn from how operators move, collect and verify money.", "w": 3008, "h": 1432}]}, {"id": "architecture", "heading": "Approach", "body": ["Extract, don't invent. Current keeps the Rivr brand as shipped and makes it repeatable for a product built around tables, balances and states."], "cards": [{"title": "🔑 Name pairs became modes", "body": "semantic/light/* and semantic/dark/* collapsed into 96 hidden primitives behind 74 Color roles with real Light and Dark modes. Error is red again, success is green, and borders and icons have their own roles."}, {"title": "🔑 Density as a mode", "body": "A Density collection with Comfortable and Compact modes drives row heights, padding and control sizes, so an operator table can tighten without a second set of components."}, {"title": "🔑 Scoped and coded", "body": "All 226 variables are scoped to the properties they may touch and carry web, iOS and Android names: var(--rv-color-...), RV.color... and RvTokens.color...."}, {"title": "🔑 States encode decisions", "body": "Status Pill separates Processing from Pending, because one means money is moving and the other means it is waiting on someone. Balance Card states what is committed versus available."}], "images": [{"slot": "DS-05", "src": "/assets/0b402ce1b59e0ee4.webp", "caption": "Seven steps from audit to governance, each with an artefact in the file.", "w": 3008, "h": 856}, {"slot": "DS-06", "src": "/assets/e5f9881d8b268327.webp", "caption": "The same instances in two frames. Only the Color mode changes.", "w": 3008, "h": 1440}]}, {"id": "foundations", "heading": "Foundations", "body": ["Products own colours: cross-border payouts are blue, Authra identity is purple and settlement is green, across wallets, tags and charts. Type runs on two families through variables (Povlar for display, Gilmer for everything else, plus mono for references) on 19 product styles. 13 radii became 8 tokens.", "Contrast was fixed at the token so every component inherited it: tertiary text 2.55 to 4.86:1, placeholders 1.97 to 4.86:1, the Authra wallet 3.36 to 4.95:1 and the dark primary button 2.90 to 6.96:1. The live contrast check also caught a new failure, warning banner text on dark at 1.42:1, which became text/on-warning at 13.46:1."], "images": [{"slot": "DS-07", "src": "/assets/6e9d74dc73f2e08e.webp", "caption": "Primitive palette, hidden from pickers, and the three product colours on their wallets.", "w": 3008, "h": 3808}, {"slot": "DS-08", "src": "/assets/c35dfed7d6720a1a.webp", "caption": "Typefaces and the anatomy of an amount: whole number first, decimals step back.", "w": 3008, "h": 1864}, {"slot": "DS-10", "src": "/assets/13cc63ec88a14d4b.webp", "caption": "What the audit caught, and every text pair checked in both modes.", "w": 3008, "h": 3686}]}, {"id": "components", "heading": "Components", "body": ["37 components across actions, inputs, data display, navigation, feedback and the money-specific pieces: Balance Card, Amount Input, Transaction Row, Status Pill, Currency Badge and Key Field. Each page documents usage, the property API, the tokens consumed and do and don't examples."], "images": [{"slot": "DS-11", "src": "/assets/26c50dfc6eebbfb5.webp", "caption": "Button: one Primary per view, the action that moves money or creates something.", "w": 3008, "h": 3164}, {"slot": "DS-12", "src": "/assets/837ddafe1d9c460b.webp", "caption": "Balance Card and Status Pill: the word always states the status, colour only reinforces it.", "w": 2693, "h": 4096}]}, {"id": "patterns", "heading": "Usage previews", "body": ["Rivr's core screens rebuilt from library instances only."], "images": [{"slot": "DS-14", "src": "/assets/04cf0a087a516f6d.webp", "caption": "Collections table and payout: rate, fee and balance shown before Confirm.", "kind": "preview", "w": 2644, "h": 4096}, {"slot": "DS-15", "src": "/assets/dabbdf23d0fb8458.webp", "caption": "Hub: onboarding progress, wallets and recent activity on one overview.", "kind": "preview", "w": 3136, "h": 2812}, {"slot": "DS-16", "src": "/assets/21ef65b1b765c671.webp", "caption": "Sandbox and secrets: a new key is shown once, in a dialog that cannot be missed.", "kind": "preview", "w": 3136, "h": 2452}]}, {"id": "release", "heading": "Release phases", "steps": [{"title": "v0.1 Foundations", "body": "Legacy ramps kept as primitives, name pairs collapsed into Light and Dark roles, error renamed to feedback/warning where it meant warning, Density and type scale captured."}, {"title": "v0.2 Money movement", "body": "Balance Card, Amount Input, Transaction Row, Status Pill, Currency Badge and Pagination, proven on Wallets and Initiate Payout."}, {"title": "v0.3 Identity and developers", "body": "Input Field, Select, Key Field, Dialog, Environment Toggle and Banner, proven on Authentications and Dev Tools."}, {"title": "v0.4 Workspace", "body": "Sidebar, Top Bar, Stat Card, Service Card, Checklist Item and Empty State, proven on Overview, Settlement and Teams."}, {"title": "v1.0 Hardening", "body": "Contrast fixed at the token, code syntax on every variable, the Patterns page and full documentation."}], "body": ["Each release followed the flow in flight, so the system never ran ahead of the product. Semantic versioning tells a squad whether an update can break a screen: major ships with a migration map from the 201 legacy variables, minor is additive, patch is a visual fix. Deprecated parts keep working for one minor version under a Deprecated / prefix."]}, {"id": "results", "heading": "Validation & results", "compare": {"before": ["23% raw fills, 51 unique hex values", "201 variables, all unscoped, light and dark as name pairs", "Error stored as yellow, success as blue, no border or icon roles", "19 of 5,564 text layers styled, 5 families, 13 sizes", "13 radii", "103 generically named components", "4 failing text pairs"], "after": ["0 hard-coded colours inside components", "226 variables, 100% scoped, Light, Dark, Comfortable and Compact", "Feedback roles that mean what they say", "19 product styles on 2 families through variables", "8 radius tokens", "37 purpose-named components", "All checked text pairs pass AA in both modes"]}, "images": [{"slot": "DS-19", "src": "/assets/c2a468f5221ae50d.webp", "caption": "Four health metrics checked every release, with the v1.0 baseline.", "w": 3008, "h": 1110}]}, {"id": "governance", "heading": "Governance", "body": ["One owner, a short contribution path (propose with a real screen, check for an existing role or variant, build with tokens only, document, release with a changelog line) and four numbers per release: hard-coded colours in components, variable scoping, AA coverage, and adoption in product files, which starts from the legacy baseline of 77% bound fills.", "VERIFY: add an adoption or delivery-speed figure once squads have moved product files onto Current. Until then this section reports what was built and measured."]}, {"id": "team", "heading": "Team members", "list": ["Damilola Olayiwola: Lead Product Designer, brand designer and design system owner", "Supporting designers, product and engineering at Altovida"]}]}, {"track": "design-system", "slug": "ledger-design-system", "client": "Baige · Business Banking", "year": "2025", "category": "p", "status": "complete", "isDraft": false, "title": "Ledger: the Baige Business Banking Design System", "intro": "Baige is business banking for agents, merchants and corporates, on a phone app and an admin web portal. Across 1,482 shipped screens, not one of 17,644 text layers used a style. I built Ledger to serve all of it: 185 scoped variables with Light and Dark plus Mobile and Desktop modes, 25 components, and a transfer button that went from 2.38:1 to 7.68:1.", "roles": ["Lead Product Designer", "Design System Lead", "UX Audit", "Accessibility", "Documentation", "Governance"], "glance": [{"value": "185", "label": "Scoped variables, Light, Dark, Mobile and Desktop"}, {"value": "25", "label": "Token-bound components, app and portal"}, {"value": "46 → 8", "label": "Corner radii"}, {"value": "2.38 → 7.68:1", "label": "Transfer button contrast"}], "cover": {"slot": "DS-01", "src": "/assets/f1138f0e6f3bd3f8.webp", "alt": "Ledger cover: the Baige design system name beside a wallet card and admin components built from it.", "w": 2880, "h": 1620}, "sections": [{"id": "context", "heading": "Context and background", "body": ["Baige serves three kinds of business and the team that runs them. Agency Banking is for agents serving walk-in customers with cash, transfers, bills and POS. Merchant Banking is for shops taking payments and settlements. Corporate Banking covers company accounts, cards and terminals. Merger is for businesses that are both agent and merchant. The Admin Web Portal is where Baige operations reviews KYC, manages tiers and terminals, and watches the numbers.", "Each area had grown its own screens. The same wallet card, transaction row and button had been redrawn for every product, on mobile and on web, in the brand's navy and gold. There was no system underneath: eight paint styles, one variable, and a style named \"Light blue\" that stored navy."]}, {"id": "role", "heading": "My role", "body": ["Lead product designer and super IC, working with a few supporting designers. I designed the product across mobile and web, ran the audit, defined the token architecture, built and documented the component library, and set the release and contribution model. Supporting designers built screens on each release and flagged gaps."]}, {"id": "audit", "heading": "Problem", "body": ["I scripted an audit of the five product pages: 1,482 screens (1,042 mobile, 440 web) and 89,533 layers across Agency, Merchant, Corporate, Merger and the Admin portal."], "list": ["Colour: 29,344 of 45,537 fills were raw hex (64%), across 128 unique values. Most of the rest used one of eight paint styles, and one local variable existed in the whole file.", "Names: paint styles were named by appearance, and the names had drifted from the values: \"Light blue\" held the navy #001F54.", "Type: 0 of 17,644 text layers used a style. 10 font families and 18 sizes, down to 6px.", "Shape and components: 46 corner radii from 1.3px to 165px, and 623 uses of a component named \"Component 1\".", "Accessibility: 7 failing pairs, led by the gold transfer button and gold labels at 2.38:1, accent grey at 3.04:1 and success green at 2.69:1."], "images": [{"slot": "DS-02", "src": "/assets/ae6c3b16107e6a5f.webp", "caption": "What we inherited, counted: 89,533 layers, 64% raw fills, 0 styled text.", "w": 3008, "h": 2096}, {"slot": "DS-03", "src": "/assets/a72e234a5e8ccfdd.webp", "caption": "Before and after, row by row. Every change maps to a measured problem.", "w": 3008, "h": 1720}]}, {"id": "principles", "heading": "Principles", "body": ["Five rules for a banking product that three kinds of business use every day: Every naira accounted for. One system, three businesses. Phone and portal speak the same language. Navy for trust, gold for action. Admins see the consequence."], "images": [{"slot": "DS-04", "src": "/assets/801d2aa7886bb6b9.webp", "caption": "Five principles, short enough to quote in a review.", "w": 3008, "h": 1084}]}, {"id": "architecture", "heading": "Approach", "body": ["One system for two platforms and three businesses. Ledger keeps the Baige navy and gold exactly as shipped, turns the paint styles into primitives, and lets every screen reach a value only through a role."], "cards": [{"title": "🔑 Styles became roles", "body": "Eight appearance-named paint styles and 128 raw values became 58 hidden primitives behind 67 Color roles with Light and Dark modes. \"Light blue\" is now navy/900, used through bg/brand and action/primary/bg."}, {"title": "🔑 Platform as a mode", "body": "Spacing, Size and Typography have Mobile and Desktop modes. A Transaction Row on the app and a Table Row in the portal use the same names; the portal just switches the mode for wider margins and larger headings."}, {"title": "🔑 Segments as colour, not components", "body": "Agent, Merchant and Corporate share every component. Only the segment colour changes, chosen at sign-up and carried through the account."}, {"title": "🔑 Components encode decisions", "body": "Wallet Card masks a hidden balance without changing height. Transaction Row signs both directions and puts status under every amount. Modal names who an admin action affects before it happens."}], "images": [{"slot": "DS-05", "src": "/assets/f704741b6b91c91b.webp", "caption": "Five layers and two axes of modes: Light or Dark for colour, Mobile or Desktop for platform.", "w": 3008, "h": 1252}, {"slot": "DS-06", "src": "/assets/925d9ebbda32e9e7.webp", "caption": "The same instances in two frames. Only the Color mode changes.", "w": 3008, "h": 1844}]}, {"id": "foundations", "heading": "Foundations", "body": ["Navy carries structure and gold marks the one thing to do next. Type runs on Roobert through variables, with 14 product styles on a 10px floor, and every amount follows one rule set: the naira sign is part of the number, kobo steps back but is never dropped, credits and debits are both signed, and a masked balance keeps its width. 46 radii became 8 tokens.", "Contrast was fixed once, at the token: gold text 2.38 to 5.45:1 by moving text to a darker gold, the transfer button 2.38 to 7.68:1 with a navy icon on gold, accent grey 3.04 to 5.37:1, grey /* ===== Locked case studies (NDA): AES-GCM content, key derived from an access code ===== */
const VAULT = (()=>{
  const L = window.DS_LOCK || {items:[]}, items = Object.fromEntries((L.items||[]).map(x=>[x.slug,x]));
  const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  let key = null; const blobs = new Map();
  async function derive(code){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(L.salt), iterations:L.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  }
  async function unlock(code){
    if(key) return true;
    if(!/^\d{4}$/.test(code) || !crypto.subtle) return false;
    try{
      const k = await derive(code);
      const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(L.iv)}, k, b64(L.ct));
      const list = JSON.parse(new TextDecoder().decode(pt));
      key = k;
      list.forEach(o => { if(!(o.slug in CASE)) CASE[o.slug] = window.DS_BUILD(o); });
      try{ sessionStorage.setItem("dsk", code); }catch(e){}
      return true;
    }catch(e){ return false; }
  }
  async function img(path){
    if(blobs.has(path)) return blobs.get(path);
    const p = fetch(path).then(r=>r.text()).then(t=>{ const buf = b64(t.trim()); return crypto.subtle.decrypt({name:"AES-GCM", iv:buf.subarray(0,12)}, key, buf.subarray(12)); })
      .then(pt=>URL.createObjectURL(new Blob([pt],{type:"image/webp"})));
    blobs.set(path, p); return p;
  }
  function hydrate(root=document){
    if(!key) return;
    root.querySelectorAll('img[src*="#v="]').forEach(i => { const path = i.getAttribute("src").split("#v=")[1]; img(path).then(u=>{ i.src = u; }).catch(()=>{}); });
  }
  return { items, unlock, hydrate, locked: slug => slug in items && !(slug in CASE) };
})();

function ClockSVG(){
  const ticks = Array.from({length:60},(_,i)=>`<line x1="32" y1="${i%5?3.5:2.5}" x2="32" y2="${i%5?5:7}" stroke="${i%5?"#333":"#777"}" stroke-width="${i%5?.6:1}" transform="rotate(${i*6} 32 32)"/>`).join("");
  return `<svg viewBox="0 0 64 64" aria-hidden="true">${ticks}<line class="hh" x1="32" y1="32" x2="32" y2="18" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><line class="mh" x1="32" y1="32" x2="32" y2="10" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/><line class="sh" x1="32" y1="36" x2="32" y2="8" stroke="#f16001" stroke-width=".8"/><circle cx="32" cy="32" r="1.4" fill="#f16001"/></svg>`;
}
function tickClock(){
  const now = new Date();
  const parts = new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Lagos",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(now);
  const g = t => +parts.find(p=>p.type===t).value;
  const h = g("hour")%24, m = g("minute"), s = g("second");
  document.querySelectorAll("[data-time]").forEach(el => el.textContent = `${pad2(h)}:${pad2(m)} WAT · GMT+1`);
  document.querySelectorAll(".clock svg").forEach(svg => {
    svg.querySelector(".hh").setAttribute("transform",`rotate(${(h%12)*30+m*.5} 32 32)`);
    svg.querySelector(".mh").setAttribute("transform",`rotate(${m*6+s*.1} 32 32)`);
    svg.querySelector(".sh").setAttribute("transform",`rotate(${s*6} 32 32)`);
  });
}
setInterval(tickClock, 1000);

function pickImg(slug, alt){
  const c = CASES[CASE[slug]]; if(!c || !alt) return null;
  for(const s of c.secs){
    if(s.t==="img" && s.alt===alt) return s.src;
    if(typeof s.h==="string" && s.h.includes('alt="'+alt+'"')){ const m = s.h.match(/<img src="([^"]+)"/); if(m) return m[1]; }
  }
  return null;
}
function featMedia(f, slug){
  const v = f.vid && MOT(f.vid);
  const inner = v ? `<video class="lazyv" muted loop playsinline preload="none" poster="${v.src}" data-src="${v.v}" aria-label="${esc(f.co)}"></video>`
                  : `<img src="${pickImg(slug,f.pick) || hiOf(slug)}" alt="${esc(f.co)} — ${esc(CASES[CASE[slug]].title)}" loading="lazy" decoding="async">`;
  return `<span class="media">${inner}</span>`;
}

const IX_CAP = 24;
function ixRows(key){ const l = listFor(key); return l.map((w,i)=>{ const h = IndexRow(w); return i>=IX_CAP ? h.replace('class="ix-r','class="ix-r xtra') : h; }).join(""); }
function moreBtn(key){ const n = listFor(key).length - IX_CAP; return n>0 ? `<button type="button" class="pbtn" data-more>Show ${n} more</button>` : ""; }
function applyFilter(key){
  FILTER = key;
  document.querySelectorAll("[data-filter]").forEach(c => c.setAttribute("aria-pressed", c.dataset.filter===key));
  const ix = $("#ix"); if(!ix) return;
  const html = ixRows(key); ix.classList.remove("open"); const mb = document.querySelector(".ix-more"); if(mb) mb.innerHTML = moreBtn(key);
  if(RM){ ix.innerHTML = html; return; }
  ix.animate([{opacity:1,filter:"blur(0)"},{opacity:0,filter:"blur(6px)"}],{duration:180,fill:"forwards"}).onfinish = () => {
    ix.innerHTML = html;
    [...ix.children].forEach((r,i)=> r.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:520,delay:i*22,easing:"cubic-bezier(.16,1,.3,1)",fill:"backwards"}));
    ix.animate([{opacity:1},{opacity:1}],{duration:1,fill:"forwards"});
  };
}

let LB = [];
function Tile(m, label, place){
  const i = LB.push(m) - 1;
  const media = m.v ? `<video class="lazyv" muted loop playsinline preload="none" poster="${m.src}" data-src="${m.v}" aria-label="${esc(m.co+": "+m.cap)}"></video>` : `<img src="${m.src||m.img}" alt="${esc(m.co?`${m.co}: ${m.cap}`:"Playground shot")}" loading="lazy" decoding="async" width="${m.w}" height="${m.h}">`;
  const cap = m.co ? `<figcaption><span>${esc(m.co)}</span><span class="mono">${esc(m.cap)}</span></figcaption>` : "";
  const pl = place ? `grid-column:${place.c};${place.o?`margin-top:${place.o};`:""}` : "";
  return `<figure class="pg-t" data-r style="flex:${(m.w/m.h).toFixed(4)} 1 0;aspect-ratio:${m.w}/${m.h};${pl}"><button class="pg-hit" data-lb="${i}" data-cur="${m.v?"Play":"View"}" aria-label="Open ${esc(m.co?`${m.co}, ${m.cap}`:"shot "+(i+1))} full screen"></button><div class="pg-m">${media}</div>${cap}<span class="pg-n">${pad2(i+1)}</span></figure>`;
}
function Playground(){
  LB = [];
  const st = id => MEDIA.stills.find(m=>m.id===id);

  const full = m => G([m,"1 / -1"]);
  const rows = [
    full(MOT("altovida")),
    G([st("centric-social"),"1 / span 7"],[MOT("coin"),"9 / span 4","14vw"]),
    J(A[0],A[1]),
    G([MOT("riur"),"3 / span 8"]),
    G([st("intelai-start"),"1 / span 5","10vw"],[st("intelai-integrations"),"7 / span 6"]),
    J(A[2],A[3],A[4]),
    G([st("renmoney-web-home"),"1 / span 7"],[st("centric-logo"),"8 / span 5","10vw"]),
    full(A[25]),
    G([MOT("dropcart"),"1 / span 7"],[st("centric-bento"),"8 / span 5","12vw"]),
    J(A[11],A[12],A[13],A[14],A[15]),
    G([st("pressone-campaign"),"5 / span 8"]),
    J(A[5],A[10]),
    J(st("renmoney-app-onboarding"),st("renmoney-app-savings")),
    G([st("renmoney-app-loans"),"3 / span 8"]),
    full(MOT("quickteller-remit")),
    J(A[6],A[7],A[8],A[9]),
    full(st("renmoney-banking-transfers")),
    G([st("centric-teams"),"1 / span 5"],[st("centric-vision"),"6 / span 7","9vw"]),
    G([A[16],"2 / span 10"]),
    G([st("intelai-copilot"),"1 / span 7","6vw"],[MOT("vervemobile"),"8 / span 5"]),
    J(A[17],A[18]),
    G([st("renmoney-web-cards"),"1 / span 6"],[st("xagents-calendar"),"7 / span 6","8vw"]),
    J(st("talstack-home"),st("talstack-analytics")),
    full(A[26]),
    G([st("pressone-callflow"),"1 / span 6"],[st("pressone-flows"),"7 / span 6","10vw"]),
    J(A[19],A[20],A[21]),
    G([A[22],"3 / span 8"]),
    G([st("centric-fs"),"6 / span 7"]),
    J(A[23],A[24]),
    G([st("talstack-module"),"2 / span 5"],[st("rencore-client"),"7 / span 6","6vw"]),
    J(st("rencore-dashboard"),st("pressone-greetings")),
    G([A[27],"1 / span 6"],[A[28],"7 / span 6","8vw"]),
    G([A[29],"1 / span 7","4vw"],[A[30],"8 / span 5"]),
    full(A[31])
  ].join("");
  const nV = MEDIA.motion.length, nS = LB.length - nV;
  return `<div class="page">${Header("playground")}<main class="wrap">
    <section class="ph"><a class="back" href="#home">← Back</a><p class="lab lab-p g sm" style="margin-bottom:18px">Playground</p><h1 class="h-xl" data-r>${split("Part flex, part flow. A handful of shots I find beautiful.")}</h1>
      <div class="meta tnum"><span>${pad2(LB.length)} pieces</span><span><i class="dot" style="margin-right:6px"></i>${pad2(nV)} in motion</span><span>${nS} stills</span></div></section>
    <div class="kflow">${rows}</div></main>${Contact()}
    <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Media viewer" hidden>
      <button class="lb-x" data-lbx aria-label="Close">Close ✕</button>

      <div class="lb-stage" id="lbs"></div><div class="lb-meta tnum"><span id="lbc"></span><span id="lbt"></span></div></div></div>`;
}
let lbI = 0, lbLast = null;
function lbShow(i){
  lbI = (i + LB.length) % LB.length; const m = LB[lbI], st = $("#lbs");
  st.innerHTML = m.v ? `<video src="${m.v}" poster="${m.src}" autoplay muted loop playsinline></video>` : `<img src="${m.src||m.img}" alt="${esc(m.co?`${m.co}: ${m.cap}`:"Playground shot")}">`;
  $("#lbc").textContent = pad2(lbI+1)+" / "+pad2(LB.length);
  $("#lbt").textContent = m.co ? `${m.co} — ${m.cap}` : "";
  st.classList.remove("in"); requestAnimationFrame(()=>st.classList.add("in"));
}
function lbOpen(i){ lbLast = document.activeElement; const lb = $("#lb"); lb.hidden = false; requestAnimationFrame(()=>lb.classList.add("on")); lenis && lenis.stop(); lbShow(i); lb.querySelector(".lb-x").focus(); }
function lbClose(){ const lb = $("#lb"); if(!lb || lb.hidden) return; lb.classList.remove("on"); lenis && lenis.start(); setTimeout(()=>{ lb.hidden = true; $("#lbs").innerHTML=""; }, 350); lbLast && lbLast.focus(); }
addEventListener("keydown", e => {
  const lb = $("#lb"); if(!lb || lb.hidden) return;
  if(e.key==="Escape") lbClose(); else if(e.key==="ArrowRight") lbShow(lbI+1); else if(e.key==="ArrowLeft") lbShow(lbI-1);
});

/* ========================= Case study ========================= */
const CASE_MOTION = {
  "vervemobile": Object.assign({alt:"VerveMobile app: buy airtime, data and bundles, then activate the wallet"}, MOT("vervemobile")),
  "quickteller-remit": Object.assign({alt:"QuickTeller Remit app in hand, showing balance and transfer history"}, MOT("quickteller-remit"))
};
const SITE = {"pressone-community-platform":"https://pressone.africa/","pressone-payment-exit-flows":"https://pressone.africa/","quickteller-remit":"https://www.quickteller.com/","vervemobile":"https://myverveworld.com/"};
function CaseStudy(slug){
  const i = CASE[slug], c = CASES[i];
  const catOf = sl => (WORK.find(w=>w[3]===sl)||[])[4];
  const cat = catOf(slug);
  const ORDER = [...new Set(WORK.filter(w=>(!cat || w[4]===cat) && w[3] in CASE && statusOf(w)==="open").map(w=>w[3]))];
  const oi = ORDER.indexOf(slug), n = oi<0 ? CASES[(i+1)%CASES.length] : CASES[CASE[ORDER[(oi+1)%ORDER.length]]];
  const hero = CASE_MOTION[slug];
  let list = c.secs.slice();
  if(hero){ const fi = list.findIndex(s=>s.t==="img"); if(fi>=0) list[fi] = {t:"vid", v:hero.v, src:hero.src, w:hero.w, h:hero.h, alt:hero.alt, l:list[fi].l}; }
  const toc = c.toc.filter(t=>t[1]!==null).map(([l,s])=>`<a href="#work/${slug}" data-sec="s${s}"><i></i>${esc(l)}</a>`).join("");
  const url = SITE[slug] || c.site;
  const secs = list.map((s,k)=> s.t==="hr" ? `<hr class="cs-hr" id="s${k}">`
    : s.t==="vid" ? `<figure class="cs-sec cs-img cs-vid" id="s${k}"><video class="lazyv" muted loop playsinline preload="none" poster="${s.src}" data-src="${s.v}" width="${s.w}" height="${s.h}" aria-label="${esc(s.alt)}"></video></figure>`
    : s.t==="img" ? `<figure class="cs-sec cs-img" id="s${k}"><img src="${s.src}" width="${s.w}" height="${s.h}" alt="${esc(s.alt||"")}" loading="${k<4?"eager":"lazy"}" decoding="async">${s.cap?`<figcaption class="cs-cap mono"><span>${esc(s.n||"")}</span>${esc(s.cap)}</figcaption>`:""}</figure>`
    : `<section class="cs-sec cs-live" id="s${k}">${s.h}</section>`).join("");
  const nCover = hiOf(n.slug) || n.thumb;
  return `<div class="page">${Header("work")}<div class="cp-prog" id="prog"></div>
    <div class="wrap"><div class="cp">
      <aside class="cp-l"><a class="back" href="#work">← All work</a>
        <p class="co">${esc(c.co)}</p><p class="yr">${c.yr}</p>
        <nav class="cp-toc" aria-label="On this page">${toc}</nav>
        ${url?`<a class="tlink site" href="${esc(url)}" target="_blank" rel="noopener">Visit live product ↗</a>`:""}</aside>
      <article class="cp-c">
        <header class="cp-h"><p class="k"><span>${esc(c.co)}</span><span class="g">·</span><span>${c.yr}</span></p><h1 data-r>${esc(c.title)}</h1>${c.sub?`<p class="sub" data-r style="--d:.08s">${esc(c.sub)}</p>`:""}</header>
        <div class="cp-body">${secs}</div>
        <a class="cp-next" href="#work/${n.slug}" data-cur="Next case"><div><p class="lab">Next project</p><p class="t">${esc(n.title)}</p><p class="g sm" style="margin-top:10px">${esc(n.co)} · ${n.yr}</p></div><span class="media"><img src="${nCover}" alt="" loading="lazy"></span></a>
      </article></div></div></div>`;
}
let tocObs;
function wireToc(){
  if(tocObs) tocObs.disconnect();
  const links=[...document.querySelectorAll(".cp-toc a")]; if(!links.length) return;
  const set=id=>links.forEach(a=>a.setAttribute("aria-current", a.dataset.sec===id));
  set(links[0].dataset.sec);
  const targets=links.map(a=>document.getElementById(a.dataset.sec)).filter(Boolean);
  tocObs=new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting) set(e.target.id); }); },{rootMargin:"0px 0px -70% 0px"});
  targets.forEach(t=>tocObs.observe(t));
}
function Gate(slug){
  const it = VAULT.items[slug];
  const mail = `mailto:${CONFIG.email}?subject=${encodeURIComponent("Access request: "+it.title)}`;
  return `<div class="page">${Header("work")}<div class="wrap"><div class="gate"><div style="padding-top:28px"><a class="back" href="#index">← Index</a></div>
    <div class="gate-c"><span class="lkic">${LOCK_IC}</span><p class="k">${esc(it.client)} · ${esc(it.year)}</p><h1>${esc(it.title)}</h1>
      <p class="gp">This case study is under NDA, so it’s locked. Enter the access code Dammy shared with you to view it.</p>
      <form class="gate-f" data-gate="${slug}" autocomplete="off"><input name="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="····" aria-label="Access code" autocomplete="one-time-code" required><button class="btn" type="submit">Unlock</button></form>
      <p class="gate-err" role="alert" aria-live="polite"></p>
      <p class="gate-req">No code? <a href="${mail}">Request access by email</a> or <a href="${CONFIG.linkedin}" target="_blank" rel="noopener">ask on LinkedIn</a>.</p></div></div></div>${Contact()}</div>`;
}
document.addEventListener("submit", async e => {
  const f = e.target.closest("[data-gate]"); if(!f) return;
  e.preventDefault();
  const inp = f.querySelector("input"), err = f.parentNode.querySelector(".gate-err"), btn = f.querySelector("button");
  btn.disabled = true; btn.textContent = "Checking…"; err.textContent = "";
  const ok = await VAULT.unlock(inp.value.trim());
  btn.disabled = false; btn.textContent = "Unlock";
  if(ok){ toast("Unlocked"); render(true); }
  else { err.textContent = "That code didn’t work. Check it and try again."; f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); inp.select(); }
});
document.addEventListener("input", e => { if(e.target.matches(".gate-f input")) e.target.value = e.target.value.replace(/\D/g,"").slice(0,4); });

/* ========================= Motion ========================= */
let lenis = null;
function initLenis(){
  if(RM || typeof Lenis === "undefined") return;
  lenis = new Lenis({lerp:.11, wheelMultiplier:1});
  const raf = t => { lenis.raf(t); requestAnimationFrame(raf); }; requestAnimationFrame(raf);
}
const scrollToEl = (el, immediate) => { if(!el) return; if(lenis) lenis.scrollTo(el,{offset:-58,immediate:!!immediate,duration:1.3}); else el.scrollIntoView({behavior:immediate?"auto":"smooth"}); };
const toTop = () => { if(lenis) lenis.scrollTo(0,{immediate:true}); else scrollTo(0,0); };
let revObs, vidObs;
function observe(root){
  if(revObs) revObs.disconnect(); if(vidObs) vidObs.disconnect();
  const els = root.querySelectorAll("[data-r]");
  if(RM){ els.forEach(e=>e.classList.add("in")); }
  else {
    revObs = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); revObs.unobserve(e.target); } }), {rootMargin:"0px 0px -8% 0px"});
    els.forEach(e=>revObs.observe(e));
  }
  vidObs = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target;
    if(e.isIntersecting){ if(!v.src && v.dataset.src){ v.src = v.dataset.src; } if(!RM) v.play().catch(()=>{}); }
    else if(!v.paused) v.pause();
  }), {rootMargin:"200px 0px"});
  root.querySelectorAll("video.lazyv").forEach(v=>vidObs.observe(v));
}
/* header progress + scrolled state */
function onScroll(){
  const y = scrollY;
  document.documentElement.classList.toggle("scrolled", y > innerHeight*.55);
  const p = $("#prog"); if(p){ const h = document.documentElement.scrollHeight - innerHeight; p.style.transform = `scaleX(${h>0?Math.min(1,y/h):0})`; }
}
addEventListener("scroll", onScroll, {passive:true});
/* wordmark: fit "Dammy Olayiwola" to the full content width (Justin Hayes) */
function fitWM(){
  const wm = $(".wm"); if(!wm) return;
  const box = wm.parentElement.clientWidth; wm.style.fontSize = "100px";
  const w = wm.getBoundingClientRect().width; wm.style.fontSize = (100 * box / w * .985) + "px";
}
addEventListener("resize", fitWM);
/* cursor label + index peek */
const cur = document.createElement("div"); cur.className = "cur";
const peek = document.createElement("div"); peek.className = "peek"; peek.innerHTML = "<img alt=''>";
let mx=0,my=0,cx=0,cy=0,px=0,py=0;
if(matchMedia("(pointer:fine)").matches && !RM){
  document.body.append(cur, peek);
  addEventListener("mousemove", e => {
    mx = e.clientX; my = e.clientY;
    const t = e.target.closest("[data-cur]"); if(t){ cur.textContent = t.dataset.cur; cur.classList.add("on"); } else cur.classList.remove("on");
    const pk = e.target.closest("[data-peek]");
    if(pk){ const src = hiOf(pk.dataset.peek) || coverOf(pk.dataset.peek); const im = peek.firstChild; if(im.getAttribute("src")!==src) im.src = src; peek.classList.add("on"); } else peek.classList.remove("on");
  }, {passive:true});
  const loop = () => { cx += (mx-cx)*.22; cy += (my-cy)*.22; px += (mx+180-px)*.12; py += (my-py)*.12;
    cur.style.left = cx+"px"; cur.style.top = cy+"px"; peek.style.left = Math.min(px, innerWidth-170)+"px"; peek.style.top = py+"px"; requestAnimationFrame(loop); };
  loop();
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2000); }

/* ========================= Router ========================= */
const SECTIONS = {work:"work", index:"index", contact:"contact", about:"about", words:"words"};
const LEGACY = {"product-design":"product-design","brand-design":"brand-design","design-systems":"design-systems","others":"others","work":"work"};
let curPage = "";
function route(){
  const key = (location.hash||"").slice(1) || "home";
  if(key.startsWith("work/")){
    const slug = key.slice(5);
    if(slug in CASE && !hiddenCase(slug)) return {page:"case:"+slug, html:()=>CaseStudy(slug), after:wireToc};
    if(VAULT.locked(slug)) return {page:"gate:"+slug, html:()=>Gate(slug)};
    return {page:"home", html:Home, section:"index"};
  }
  if(key==="profile") return {page:"profile", html:Profile};
  if(key==="testimonials") return {page:"testimonials", html:Words};
  if(key==="playground") return {page:"playground", html:Playground};
  if(key in SECTIONS) return {page:"home", html:Home, section:SECTIONS[key]};
  if(FILTERS.some(f=>f[0]===key)) return {page:"home", html:Home, section:"index", filter:key};
  return {page:"home", html:Home, section:null};
}
function render(force){
  const r = route();
  if(r.filter) FILTER = r.filter;
  if(r.page === curPage && !force){
    if(r.filter) applyFilter(r.filter);
    if(r.section) scrollToEl(document.getElementById(r.section)); else toTop();
    document.documentElement.classList.remove("menu-open"); const m=$("#mnav"); if(m) m.hidden = true;
    return;
  }
  const swap = () => {
    curPage = r.page;
    $("#app").innerHTML = r.html();
    toTop();
    fitWM(); onScroll(); tickClock();
    r.after && r.after();
    observe($("#app"));
    (window.__intro||Promise.resolve()).then(()=>requestAnimationFrame(()=>document.documentElement.classList.add("ready")));
    if(r.section) setTimeout(()=>scrollToEl(document.getElementById(r.section), true), 30);
    if(document.fonts) document.fonts.ready.then(fitWM);
    $(".veil").classList.remove("on");
  };
  if(curPage && !RM){ $(".veil").classList.add("on"); setTimeout(swap, 320); } else swap();
}
addEventListener("hashchange", () => render());

document.addEventListener("click", e => {
  const tt = e.target.closest("[data-theme-toggle]");
  if(tt){
    const de = document.documentElement, next = de.dataset.theme === "light" ? "dark" : "light";
    de.classList.add("theme-anim"); de.setAttribute("data-theme", next);
    setTimeout(() => de.classList.remove("theme-anim"), 400);
    try{ localStorage.setItem("theme", next); }catch(_){}
    const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = next === "light" ? "#f3f1ec" : "#000000";
    document.querySelectorAll("[data-theme-toggle]").forEach(b => b.setAttribute("aria-label", "Switch to " + (next === "light" ? "dark" : "light") + " mode"));
    document.querySelectorAll(".mk video").forEach(v => { if(v.offsetParent) v.play().catch(()=>{}); });
    return;
  }
  const c = e.target.closest("[data-copy]");
  if(c){ e.preventDefault();
    const ok = () => { toast("Email copied — " + CONFIG.email); if(c.classList.contains("btn")){ const l = c.innerHTML; c.classList.add("is-copied"); c.textContent = "Copied ✓"; setTimeout(()=>{ c.innerHTML = l; c.classList.remove("is-copied"); }, 1800); } };
    (navigator.clipboard ? navigator.clipboard.writeText(CONFIG.email) : Promise.reject()).then(ok, ()=>toast(CONFIG.email)); return; }
  const mo = e.target.closest("[data-more]"); if(mo){ $("#ix").classList.add("open"); mo.remove(); return; }
  const fc = e.target.closest("[data-filter]"); if(fc){ e.preventDefault(); applyFilter(fc.dataset.filter); return; }
  const m = e.target.closest("[data-menu]");
  if(m){ const s = $("#mnav"), open = s.hidden; s.hidden = !open; m.setAttribute("aria-expanded", open); m.textContent = open ? "Close" : "Menu"; open ? lenis&&lenis.stop() : lenis&&lenis.start(); return; }
  if(e.target.closest(".mnav a")){ $("#mnav").hidden = true; lenis&&lenis.start(); }
  const a = e.target.closest('a[href^="#"]');
  if(a && a.getAttribute("href") === location.hash && !a.dataset.sec){ e.preventDefault(); render(); return; }
  const lbt = e.target.closest("[data-lb]"); if(lbt){ e.preventDefault(); lbOpen(+lbt.dataset.lb); return; }
  if(e.target.closest("[data-lbx]") || e.target.id==="lb" || e.target.id==="lbs"){ lbClose(); return; }
  if(e.target.closest("[data-lbn]")){ lbShow(lbI+1); return; }
  if(e.target.closest("[data-lbp]")){ lbShow(lbI-1); return; }
  const t = e.target.closest("[data-sec]");
  if(t){ e.preventDefault(); scrollToEl(document.getElementById(t.dataset.sec)); }
});
addEventListener("keydown", e => { const s = $("#mnav"); if(e.key==="Escape" && s && !s.hidden){ s.hidden = true; lenis&&lenis.start(); } });

initLenis();
render();
syncVis();

</script>
